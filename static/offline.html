<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - GoatFlow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            text-align: center;
            max-width: 400px;
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.5rem;
            opacity: 0.5;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
            color: #00E5FF;
        }
        p {
            font-size: 0.9rem;
            color: #999;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        button {
            background: #00E5FF;
            color: #0a0a1a;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.364 5.636a9 9 0 010 12.728m-2.829-2.829a5 5 0 000-7.07m-4.243 9.9a9 9 0 01-6.364-2.636m2.829-2.829a5 5 0 017.07 0"></path>
            <line x1="4" y1="4" x2="20" y2="20" stroke-width="2"></line>
        </svg>
        <h1>You are offline</h1>
        <p>Please check your internet connection and try again. GoatFlow requires a network connection to manage tickets.</p>
        <button onclick="location.reload()">Try Again</button>
    </div>
</body>
</html>
