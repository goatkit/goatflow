# GoatFlow Reference Deployment
# Copy this file and .env.example, customize .env for your environment
#
# Usage:
#   curl -O https://raw.githubusercontent.com/goatkit/goatflow/main/deploy/docker-compose.yml
#   curl -O https://raw.githubusercontent.com/goatkit/goatflow/main/deploy/.env.example
#   cp .env.example .env
#   # Edit .env with your values
#   docker compose up -d

# Settings shared by app, customer-fe and runner
x-goatflow-env: &goatflow-env
  APP_ENV: ${APP_ENV:-production}
  GIN_MODE: ${GIN_MODE:-release}
  LOG_LEVEL: ${LOG_LEVEL:-warn}
  DB_DRIVER: mysql
  DB_MYSQL_HOST: mariadb
  DB_MYSQL_PORT: 3306
  DB_MYSQL_USER: ${DB_USER:-goatflow}
  DB_MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_MYSQL_NAME: ${DB_NAME:-goatflow}
  GOATFLOW_VALKEY_HOST: valkey
  GOATFLOW_VALKEY_PORT: 6379
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  # Encrypts stored secrets (webhook signing secrets, plugin secure settings).
  # Every process must use the same key or the runner cannot decrypt them.
  GOATFLOW_SECURE_KEY: ${GOATFLOW_SECURE_KEY:?GOATFLOW_SECURE_KEY is required - 64 hex characters, generate with openssl rand -hex 32}
  BASE_URL: ${BASE_URL:-https://${DOMAIN}}
  # Outgoing email: the runner sends the mail queue, the app sends some mail directly
  GOATFLOW_EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
  GOATFLOW_EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
  GOATFLOW_EMAIL_SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
  GOATFLOW_EMAIL_SMTP_PORT: ${SMTP_PORT:-587}
  GOATFLOW_EMAIL_SMTP_USER: ${SMTP_USER:-}
  GOATFLOW_EMAIL_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  GOATFLOW_EMAIL_SMTP_TLS: ${SMTP_TLS:-true}
  GOATFLOW_EMAIL_SMTP_AUTH_TYPE: ${SMTP_AUTH_TYPE:-plain}
  # Optional external search (docs/ZINC_SEARCH.md); empty = built-in database search
  SEARCH_BACKEND: ${SEARCH_BACKEND:-}
  SEARCH_INDEX_PREFIX: ${SEARCH_INDEX_PREFIX:-}
  ZINC_ENDPOINT: ${ZINC_ENDPOINT:-}
  ZINC_USER: ${ZINC_USER:-}
  ZINC_PASSWORD: ${ZINC_PASSWORD:-}
  ELASTICSEARCH_ENDPOINT: ${ELASTICSEARCH_ENDPOINT:-}
  ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
  ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}

services:
  caddy:
    image: docker.io/caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      - app
      - customer-fe
    restart: unless-stopped

  mariadb:
    image: docker.io/mariadb:11-jammy
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_USER: ${DB_USER:-goatflow}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_DATABASE: ${DB_NAME:-goatflow}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MARIADB_PASSWORD\" mariadb-admin ping -h localhost -u \"$$MARIADB_USER\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: ghcr.io/goatkit/goatflow:${GOATFLOW_TAG:-latest}
    environment:
      <<: *goatflow-env
      # First-boot password for root@localhost; applied once, ignored afterwards
      GOATFLOW_ADMIN_PASSWORD: ${GOATFLOW_ADMIN_PASSWORD:-}
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    expose:
      - "8080"
    stop_grace_period: 45s
    restart: unless-stopped

  customer-fe:
    image: ghcr.io/goatkit/goatflow:${GOATFLOW_TAG:-latest}
    environment:
      <<: *goatflow-env
      CUSTOMER_FE_ONLY: "true"
      ROOT_REDIRECT_PATH: /customer
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    expose:
      - "8080"
    stop_grace_period: 45s
    restart: unless-stopped

  runner:
    image: ghcr.io/goatkit/goatflow-runner:${GOATFLOW_TAG:-latest}
    command: ["./goats", "-mode", "runner"]
    environment:
      <<: *goatflow-env
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy
    stop_grace_period: 45s
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  mariadb_data:

configs:
  caddyfile:
    content: |
      {$$DOMAIN} {
          tls {$$ACME_EMAIL}

          # Customer portal - pages and API
          @customer {
              path /customer/*
              path /auth/customer
              path /api/auth/customer/*
          }
          handle @customer {
              reverse_proxy customer-fe:8080
          }

          # Short URL: /c/<path> -> /customer/<path> (handle_path strips /c)
          handle_path /c/* {
              redir * /customer{uri} permanent
          }

          # Agent/main app (default) - handles everything else
          handle {
              reverse_proxy app:8080
          }

          encode gzip
          header {
              X-Content-Type-Options nosniff
              X-Frame-Options DENY
              Referrer-Policy strict-origin-when-cross-origin
              -Server
          }
          log {
              output stdout
              format console
          }
      }
