# Gitleaks Configuration
# https://github.com/gitleaks/gitleaks

title = "GoatFlow Gitleaks Configuration"

# Extend the default configuration
[extend]
useDefault = true

# Custom rules for GoatFlow-specific token formats
[[rules]]
id = "goatflow-api-token"
description = "GoatFlow API token (gf_<hex>_<hex>)"
regex = '''gf_[a-f0-9]{8}_[a-f0-9]{48}'''
tags = ["key", "goatflow", "apitoken"]
keywords = ["gf_"]

[[rules]]
id = "goatflow-jwt-secret"
description = "GoatFlow JWT secret in config"
regex = '''(?i)(jwt[_-]?secret|session[_-]?secret)\s*[:=]\s*["']?[a-f0-9]{32,}["']?'''
tags = ["key", "jwt", "goatflow"]
keywords = ["jwt_secret", "jwt-secret", "session_secret", "session-secret"]

# Paths to exclude from scanning (test files with example tokens)
[allowlist]
paths = [
    # Template/example env files contain placeholder values only, never real credentials
    '''\.env\.development''',
    '''\.env\.example''',
    # Deploy reference files contain example/placeholder values
    '''deploy/\.env\.example''',
    '''deploy/docker-compose\.yml''',
    # Pact contract test files contain test JWT tokens
    '''web/src/contracts/auth\.pact\.test\.ts''',
    '''web/pacts/.*\.json''',
    # Test data directories
    '''testdata/''',
    '''test-secrets/''',
    # Generated files
    '''web/src/types/api\.ts''',
    # Lockfiles (no secrets, just dependency metadata)
    '''bun\.lock(b)?''',
    # Design docs contain example/placeholder tokens (gf_EXAMPLE_, sk_live_xxx, etc.)
    '''docs/design/.*\.md''',
    # MCP client config template (placeholder token, not real)
    '''\.mcp\.json\.example''',
    # Crypto test uses a fake Stripe key (sk_live_abc123def456) for encryption/decryption tests
    '''internal/secureconfig/crypto_test\.go''',
]

# Stop words to prevent false positives
stopwords = [
    "test",
    "example",
    "mock",
    "dummy",
    "sample",
    "FAKE",
    "DO_NOT_USE",
    "placeholder",
    "sk_live_xxx",
    "sk_live_org",
]
