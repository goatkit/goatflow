# Gitleaks Configuration
# https://github.com/gitleaks/gitleaks

title = "GoatFlow Gitleaks Configuration"

# Extend the default configuration
[extend]
useDefault = true

# Paths to exclude from scanning (test files with example tokens)
[allowlist]
paths = [
    # Template/example env files contain placeholder values only, never real credentials
    '''\.env\.development''',
    '''\.env\.example''',
    # Deploy reference files contain example/placeholder values
    '''deploy/\.env\.example''',
    '''deploy/docker-compose\.yml''',
    # Pact contract test files contain test JWT tokens
    '''web/src/contracts/auth\.pact\.test\.ts''',
    '''web/pacts/.*\.json''',
    # Test data directories
    '''testdata/''',
    '''test-secrets/''',
    # Generated files
    '''web/src/types/api\.ts''',
    # Binary lockfiles (no secrets, just dependency metadata)
    '''bun\.lockb''',
    # Design docs contain example/placeholder tokens (gf_EXAMPLE_, sk_live_xxx, etc.)
    '''docs/design/.*\.md''',
]

# Stop words to prevent false positives
stopwords = [
    "test",
    "example",
    "mock",
    "dummy",
    "sample",
    "FAKE",
    "DO_NOT_USE",
    "placeholder",
    "sk_live_xxx",
    "sk_live_org",
]
