resources:
  limits:
    cpus: 2
    memory: 4096

goatflow:
  db_password: goatflow-db-password
  db_root_password: goatflow-root-password
  valkey_password: goatflow-valkey-password
  jwt_secret: test-jwt-secret-minimum-32-characters
  secure_key: test-secure-key-minimum-32-characters
  admin_password: goatflow-admin-password
  email_enabled: false
  email_from: support@example.com
  smtp_host: smtp.example.com
  smtp_port: 587
  smtp_user: support@example.com
  smtp_password: smtp-password
  smtp_tls: true
  enable_customer_fe: false
  additional_envs: []

run_as:
  user: 1000
  group: 1000

network:
  web_port:
    bind_mode: published
    port_number: 30484
    host_ips: []
  customer_fe_port:
    bind_mode: published
    port_number: 30483
    host_ips: []

ix_volumes:
  data: /opt/tests/mnt/goatflow-data
  plugins: /opt/tests/mnt/goatflow-plugins
  mariadb_data: /opt/tests/mnt/goatflow-mariadb

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  plugins:
    type: ix_volume
    ix_volume_config:
      dataset_name: plugins
      create_host_path: true
  mariadb_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: mariadb_data
      create_host_path: true
  additional_storage: []

labels: []
