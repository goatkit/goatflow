{% set tpl = ix_lib.base.render.Render(values) %}

{% set goatflow_net = tpl.networks.create_internal("goatflow-net") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}

{% set mariadb_config = {
  "user": values.consts.db_user,
  "root_password": values.goatflow.db_root_password,
  "password": values.goatflow.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.mariadb_data,
} %}
{% set mariadb = tpl.deps.mariadb(values.consts.mariadb_container_name, "mariadb_image", mariadb_config, perm_container) %}
{% do mariadb.container.add_network(goatflow_net) %}

{% set valkey_config = {
  "password": values.goatflow.valkey_password,
  "volume": {"type": "temporary", "volume_config": {"volume_name": "valkey-data"}},
} %}
{% set valkey = tpl.deps.redis(values.consts.valkey_container_name, "valkey_image", valkey_config, perm_container) %}
{% do valkey.container.add_network(goatflow_net) %}

{# Permissions init: chown data/plugins to the app uid before the app starts #}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}
{% do perm_container.add_or_skip_action("goatflow_data", values.storage.data, perms_config) %}
{% do perm_container.add_or_skip_action("goatflow_plugins", values.storage.plugins, perms_config) %}
{% for store in values.storage.additional_storage %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{#
  0.9.0 (the pinned image) reads flat DB_* env; later images read namespaced
  DB_MYSQL_* and fall back to flat DB_*. Emitting the flat set works for both.
  Namespaced-only would break 0.9.0: it would dial localhost:3306.
#}
{% set db_env = {
  "DB_HOST": values.consts.mariadb_container_name,
  "DB_PORT": "3306",
  "DB_NAME": values.consts.db_name,
  "DB_USER": values.consts.db_user,
  "DB_PASSWORD": values.goatflow.db_password,
} %}

{% set app_env = {
  "APP_ENV": "production",
  "APP_PORT": "8080",
  "ENABLE_YAML_ROUTING": "true",
  "DB_DRIVER": "mariadb",
  "DB_MAX_CONNECTIONS": "100",
  "DB_MAX_IDLE_CONNECTIONS": "10",
  "DB_CONNECTION_MAX_LIFETIME": "30m",
  "VALKEY_HOST": values.consts.valkey_container_name,
  "VALKEY_PORT": "6379",
  "GOATFLOW_VALKEY_PASSWORD": values.goatflow.valkey_password,
  "JWT_SECRET": values.goatflow.jwt_secret,
  "JWT_ACCESS_TOKEN_EXPIRY": "15m",
  "JWT_REFRESH_TOKEN_EXPIRY": "7d",
  "GOATFLOW_SECURE_KEY": values.goatflow.secure_key,
  "GOATFLOW_ADMIN_PASSWORD": values.goatflow.admin_password,
  "PASSWORD_HASH_TYPE": "sha256",
  "STORAGE_PATH": "/app/storage",
  "MAX_UPLOAD_SIZE": "10MB",
  "ALLOWED_FILE_TYPES": "pdf,doc,docx,txt,png,jpg,jpeg,gif,zip",
  "GOATFLOW_PLUGIN_LAZY_LOAD": "true",
  "GOATFLOW_PLUGIN_HOT_RELOAD": "false",
} %}
{% do app_env.update(db_env) %}

{% set c1 = tpl.add_container(values.consts.goatflow_container_name, "image") %}
{% do c1.add_network(goatflow_net) %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.depends.add_dependency(values.consts.mariadb_container_name, "service_healthy") %}
{% do c1.depends.add_dependency(values.consts.valkey_container_name, "service_healthy") %}
{# alpine image ships busybox wget (no curl) - mirrors the Dockerfile HEALTHCHECK #}
{% do c1.healthcheck.set_test("wget", {"port": values.consts.internal_app_port, "path": "/health"}) %}
{% do c1.healthcheck.set_start_period(30) %}
{% do c1.healthcheck.set_retries(5) %}
{% for env_name, env_value in app_env.items() %}
  {% do c1.environment.add_env(env_name, env_value) %}
{% endfor %}
{% do c1.environment.add_user_envs(values.goatflow.additional_envs) %}
{% do c1.add_storage("/app/storage", values.storage.data) %}
{% do c1.add_storage("/app/config/plugins", values.storage.plugins) %}
{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}
{# app listens on internal_app_port - map host port_number to it #}
{% do c1.add_port(values.network.web_port, {"container_port": values.consts.internal_app_port}) %}

{% set runner = tpl.add_container(values.consts.runner_container_name, "image") %}
{% do runner.add_network(goatflow_net) %}
{% do runner.set_user(values.run_as.user, values.run_as.group) %}
{% do runner.depends.add_dependency(values.consts.mariadb_container_name, "service_healthy") %}
{% do runner.set_command(["./goats", "-mode", "runner"]) %}
{# runner has no HTTP endpoint - verify the goats binary is running as PID 1 #}
{% do runner.healthcheck.set_test("pidof", {"process": "goats"}) %}
{% do runner.healthcheck.set_interval(60) %}
{% do runner.healthcheck.set_retries(3) %}
{% do runner.healthcheck.set_start_period(30) %}
{% for env_name, env_value in app_env.items() %}
  {% do runner.environment.add_env(env_name, env_value) %}
{% endfor %}
{% do runner.environment.add_env("GOATFLOW_EMAIL_ENABLED", values.goatflow.email_enabled) %}
{% do runner.environment.add_env("GOATFLOW_EMAIL_FROM", values.goatflow.email_from) %}
{% do runner.environment.add_env("GOATFLOW_EMAIL_SMTP_HOST", values.goatflow.smtp_host) %}
{% do runner.environment.add_env("GOATFLOW_EMAIL_SMTP_PORT", values.goatflow.smtp_port) %}
{% do runner.environment.add_env("GOATFLOW_EMAIL_SMTP_USER", values.goatflow.smtp_user) %}
{% do runner.environment.add_env("GOATFLOW_EMAIL_SMTP_PASSWORD", values.goatflow.smtp_password) %}
{% do runner.environment.add_env("GOATFLOW_EMAIL_SMTP_TLS", values.goatflow.smtp_tls) %}
{% do runner.environment.add_user_envs(values.goatflow.additional_envs) %}
{% do runner.add_storage("/app/config/plugins", values.storage.plugins) %}

{% set fe_enabled = values.goatflow.enable_customer_fe %}
{% if fe_enabled %}
  {% set fe = tpl.add_container(values.consts.customer_fe_container_name, "image") %}
  {% do fe.add_network(goatflow_net) %}
  {% do fe.set_user(values.run_as.user, values.run_as.group) %}
  {% do fe.depends.add_dependency(values.consts.mariadb_container_name, "service_healthy") %}
  {% do fe.depends.add_dependency(values.consts.valkey_container_name, "service_healthy") %}
  {% do fe.healthcheck.set_test("wget", {"port": values.consts.internal_app_port, "path": "/health"}) %}
  {% do fe.healthcheck.set_start_period(30) %}
  {% do fe.healthcheck.set_retries(5) %}
  {% for env_name, env_value in app_env.items() %}
    {% do fe.environment.add_env(env_name, env_value) %}
  {% endfor %}
  {% do fe.environment.add_env("CUSTOMER_FE_ONLY", "true") %}
  {% do fe.environment.add_user_envs(values.goatflow.additional_envs) %}
  {% do fe.add_storage("/app/storage", values.storage.data) %}
  {% do fe.add_storage("/app/config/plugins", values.storage.plugins) %}
  {# customer FE runs the same image on the same internal port #}
{% do fe.add_port(values.network.customer_fe_port, {"container_port": values.consts.internal_app_port}) %}
{% endif %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do mariadb.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do valkey.container.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do runner.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% if fe_enabled %}
    {% do fe.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% endif %}
{% endif %}

{% if values.network.web_port.bind_mode == "published" %}
  {% do tpl.portals.add(values.network.web_port) %}
{% endif %}
{% if fe_enabled and values.network.customer_fe_port.bind_mode == "published" %}
  {% do tpl.portals.add(values.network.customer_fe_port, {"name": "Customer Portal"}) %}
{% endif %}

{{ tpl.render() | tojson }}
