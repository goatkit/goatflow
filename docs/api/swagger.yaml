basePath: /api/v1
definitions:
  internal_api.adminSQLRequest:
    properties:
      args:
        items: {}
        type: array
      query:
        type: string
    required:
    - query
    type: object
host: localhost:8080
info:
  contact:
    email: hello@goatflow.io
    name: GoatFlow Support
    url: https://goatflow.io/support
  description: GoatFlow Ticket System REST API
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://goatflow.io/terms/
  title: GoatFlow API
  version: "1.0"
paths:
  /admin/sql:
    post:
      consumes:
      - application/json
      description: 'Execute a read-only SQL query (admin only). Allowed statements:
        SELECT, DESCRIBE, EXPLAIN, SHOW TABLES, SHOW COLUMNS.'
      parameters:
      - description: SQL query and optional arguments
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.adminSQLRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Query results
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Execute read-only SQL query
      tags:
      - Admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with login/password and return JWT tokens
      parameters:
      - description: Login credentials (login, password)
        in: body
        name: credentials
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: JWT tokens (access_token, refresh_token)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties: true
            type: object
      summary: Login
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a refresh token (from login or a previous refresh) for
        a new access token and refresh token. The account is reloaded, so role and
        admin flag are current; disabled or deleted accounts are rejected.
      parameters:
      - description: 'Refresh token: {\'
        in: body
        name: token
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 'Same body as login: user, access_token, refresh_token, token_type,
            expires_in, refresh_expires_in'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing refresh_token
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid, expired or revoked-account refresh token
          schema:
            additionalProperties: true
            type: object
      summary: Refresh token
      tags:
      - Authentication
  /groups:
    get:
      consumes:
      - application/json
      description: Retrieve all groups
      produces:
      - application/json
      responses:
        "200":
          description: List of groups
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List groups
      tags:
      - Groups
  /i18n/coverage:
    get:
      responses: {}
  /i18n/export/{lang}:
    get:
      responses: {}
  /i18n/language:
    post:
      responses: {}
  /i18n/languages:
    get:
      responses: {}
  /i18n/missing/{lang}:
    get:
      responses: {}
  /i18n/stats:
    get:
      responses: {}
  /i18n/translate:
    post:
      responses: {}
  /i18n/translations:
    get:
      responses: {}
  /i18n/translations/{lang}:
    get:
      responses: {}
  /i18n/validate/{lang}:
    get:
      responses: {}
  /priorities:
    get:
      consumes:
      - application/json
      description: Retrieve all ticket priorities
      produces:
      - application/json
      responses:
        "200":
          description: List of priorities
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List priorities
      tags:
      - Priorities
    post:
      consumes:
      - application/json
      description: Create a new ticket priority
      parameters:
      - description: Priority data
        in: body
        name: priority
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created priority
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create priority
      tags:
      - Priorities
  /priorities/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a priority
      parameters:
      - description: Priority ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Priority deleted
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Priority not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete priority
      tags:
      - Priorities
    get:
      consumes:
      - application/json
      description: Retrieve a single priority
      parameters:
      - description: Priority ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Priority details
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Priority not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get priority by ID
      tags:
      - Priorities
    put:
      consumes:
      - application/json
      description: Update an existing priority
      parameters:
      - description: Priority ID
        in: path
        name: id
        required: true
        type: integer
      - description: Priority update data
        in: body
        name: priority
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Updated priority
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Priority not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update priority
      tags:
      - Priorities
  /queues:
    get:
      consumes:
      - application/json
      description: Retrieve all queues the user has access to (RBAC filtered)
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of queues
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List queues
      tags:
      - Queues
    post:
      consumes:
      - application/json
      description: Create a new queue
      parameters:
      - description: Queue data (name, group_id, etc.)
        in: body
        name: queue
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created queue
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create queue
      tags:
      - Queues
  /queues/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a queue (soft delete)
      parameters:
      - description: Queue ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Queue deleted
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Queue not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete queue
      tags:
      - Queues
    get:
      consumes:
      - application/json
      description: Retrieve a single queue by its ID
      parameters:
      - description: Queue ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Queue details
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Queue not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get queue by ID
      tags:
      - Queues
    put:
      consumes:
      - application/json
      description: Update an existing queue
      parameters:
      - description: Queue ID
        in: path
        name: id
        required: true
        type: integer
      - description: Queue update data
        in: body
        name: queue
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Updated queue
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Queue not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update queue
      tags:
      - Queues
  /queues/{id}/agents:
    get:
      consumes:
      - application/json
      description: List agents assigned to a queue
      parameters:
      - description: Queue ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of agents
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Queue not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get queue agents
      tags:
      - Queues
  /queues/{id}/groups:
    post:
      consumes:
      - application/json
      description: Make the given group the queue's permission group (queue.group_id),
        replacing the current one. A queue has exactly one group.
      parameters:
      - description: Queue ID
        in: path
        name: id
        required: true
        type: integer
      - description: Group assignment (group_id)
        in: body
        name: group
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Group assigned
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or group
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Queue not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Set queue group
      tags:
      - Queues
  /queues/{id}/groups/{group_id}:
    delete:
      consumes:
      - application/json
      description: A queue has exactly one group, which cannot be removed. Returns
        409 for the queue's group and 404 for any other group. Use POST /queues/{id}/groups
        to change it.
      parameters:
      - description: Queue ID
        in: path
        name: id
        required: true
        type: integer
      - description: Group ID
        in: path
        name: group_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Queue not found or group not assigned
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Queue must keep its group
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Remove group from queue (always rejected)
      tags:
      - Queues
  /queues/{id}/stats:
    get:
      consumes:
      - application/json
      description: Get ticket statistics for a queue
      parameters:
      - description: Queue ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Queue statistics
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Queue not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get queue statistics
      tags:
      - Queues
  /salutations:
    get:
      consumes:
      - application/json
      description: List all email salutations
      produces:
      - application/json
      responses:
        "200":
          description: List of salutations
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List salutations
      tags:
      - Email Identity
    post:
      consumes:
      - application/json
      description: Create a new email salutation
      parameters:
      - description: Salutation data
        in: body
        name: salutation
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created salutation
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create salutation
      tags:
      - Email Identity
  /salutations/{id}:
    put:
      consumes:
      - application/json
      description: Update an email salutation
      parameters:
      - description: Salutation ID
        in: path
        name: id
        required: true
        type: integer
      - description: Salutation update data
        in: body
        name: salutation
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Updated salutation
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update salutation
      tags:
      - Email Identity
  /search:
    post:
      consumes:
      - application/json
      description: Full-text search across tickets, articles and customers. Ticket
        and article hits are limited to queues the caller can read.
      parameters:
      - description: Search query
        in: body
        name: query
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Search results
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Search backend unavailable or index not built
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Search tickets
      tags:
      - Search
  /search/health:
    get:
      description: Report whether the search backend can serve searches; for Zinc
        and Elasticsearch also the index state, document counts and the latest reindex
        started by this server.
      produces:
      - application/json
      responses:
        "200":
          description: Search health status
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Backend unreachable, misconfigured or index not built
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Search health
      tags:
      - Search
  /search/reindex:
    post:
      description: Start a full rebuild of the Zinc or Elasticsearch index in the
        background (admin only). Progress is reported by GET /search/health. The database
        backend needs no index.
      produces:
      - application/json
      responses:
        "200":
          description: 'Database backend: nothing to do'
          schema:
            additionalProperties: true
            type: object
        "202":
          description: Reindex started
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Admin access required
          schema:
            additionalProperties: true
            type: object
        "409":
          description: A reindex is already running
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Search backend misconfigured
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Reindex search
      tags:
      - Search
  /search/saved:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: '{success, data: {searches: [{name, type}], total}}'
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List saved searches
      tags:
      - Search
    post:
      consumes:
      - application/json
      parameters:
      - description: '{name, type: TicketSearch (optional), parameters: {<search parameter>:
          string | [string]}}'
        in: body
        name: search
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: '{success, data: {name, type, parameters}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid name or parameters
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Name already used
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create saved search
      tags:
      - Search
  /search/saved/{name}:
    delete:
      parameters:
      - description: Saved search name
        in: path
        name: name
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete saved search
      tags:
      - Search
    get:
      parameters:
      - description: Saved search name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{success, data: {name, type, parameters, ignored_parameters}}'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get saved search
      tags:
      - Search
    put:
      consumes:
      - application/json
      parameters:
      - description: Saved search name
        in: path
        name: name
        required: true
        type: string
      - description: '{parameters: {<search parameter>: string | [string]}}'
        in: body
        name: search
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: '{success, data: {name, type, parameters}}'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid parameters
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update saved search
      tags:
      - Search
  /search/saved/{name}/execute:
    post:
      parameters:
      - description: Saved search name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{success, data: {name, parameters, ignored_parameters, tickets,
            pagination}}'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Execute saved search
      tags:
      - Search
  /search/tickets:
    get:
      description: Agent ticket search over ticket, article and customer data. Text
        parameters match case-insensitively anywhere ('*' is a wildcard); ID and state_type
        parameters take comma-separated or repeated values; created_/changed_ take
        YYYY-MM-DD (whole day) or timestamps.
      parameters:
      - description: Words that must each match ticket number, title, customer, customer
          user (login, name, email), company name, or an article's subject, body,
          from or to
        in: query
        name: q
        type: string
      - description: Ticket number
        in: query
        name: tn
        type: string
      - description: Ticket title
        in: query
        name: title
        type: string
      - description: Customer (company) ID
        in: query
        name: customer_id
        type: string
      - description: Customer user login
        in: query
        name: customer_user_login
        type: string
      - description: Article From
        in: query
        name: from
        type: string
      - description: Article To or Cc
        in: query
        name: to
        type: string
      - description: Article subject
        in: query
        name: subject
        type: string
      - description: Article body
        in: query
        name: body
        type: string
      - description: State types (new, open, pending, pending reminder, pending auto,
          closed, merged, removed)
        in: query
        name: state_type
        type: string
      - description: State IDs
        in: query
        name: state_id
        type: string
      - description: Queue IDs
        in: query
        name: queue_id
        type: string
      - description: Priority IDs
        in: query
        name: priority_id
        type: string
      - description: Ticket type IDs
        in: query
        name: type_id
        type: string
      - description: Owner agent IDs
        in: query
        name: owner_id
        type: string
      - description: Responsible agent IDs
        in: query
        name: responsible_id
        type: string
      - description: Lock IDs
        in: query
        name: lock_id
        type: string
      - description: Created at or after
        in: query
        name: created_after
        type: string
      - description: 'Created before (date: up to the end of that day)'
        in: query
        name: created_before
        type: string
      - description: Changed at or after
        in: query
        name: changed_after
        type: string
      - description: 'Changed before (date: up to the end of that day)'
        in: query
        name: changed_before
        type: string
      - default: created
        description: created, changed, priority, tn, title
        in: query
        name: sort
        type: string
      - default: desc
        description: asc or desc
        in: query
        name: order
        type: string
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 25
        description: Page size (max 100)
