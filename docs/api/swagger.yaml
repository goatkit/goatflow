      responses:
        "201":
          description: Created token (includes raw token - save it!)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create API token
      tags:
      - API Tokens
  /tokens/{id}:
    delete:
      consumes:
      - application/json
      description: Revoke an API token (user can only revoke own tokens)
      parameters:
      - description: Token ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Token revoked
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Token not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Revoke API token
      tags:
      - API Tokens
  /tokens/scopes:
    get:
      consumes:
      - application/json
      description: List available scopes for token creation (filtered by user role)
      produces:
      - application/json
      responses:
        "200":
          description: List of available scopes
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get available scopes
      tags:
      - API Tokens
  /types:
    get:
      consumes:
      - application/json
      description: Retrieve ticket types (valid ones by default)
      parameters:
      - description: Filter by validity (true/1 = valid (default), false/0 = invalid,
          all)
        in: query
        name: valid
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of types
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Lookup failed
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List types
      tags:
      - Types
  /users:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated list of users (agents)
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Search in login, name, email
        in: query
        name: search
        type: string
      - description: Filter by group membership
        in: query
        name: group_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of users
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - Users
    post:
      consumes:
      - application/json
      description: Create a new agent user
      parameters:
      - description: User data (login, email, first_name, last_name, password)
        in: body
        name: user
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created user
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create user
      tags:
      - Users
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Soft delete a user (deactivate)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User deleted
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - Users
    get:
      consumes:
      - application/json
      description: Retrieve a single user by their ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User details
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Update an existing user's properties
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: User update data
        in: body
        name: user
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Updated user
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - Users
  /users/me:
    get:
      consumes:
      - application/json
      description: Get the authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: User profile
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Users
  /webhook-deliveries/{id}:
    get:
      description: One delivery including payload and response body
      parameters:
      - description: Delivery ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'success, data: WebhookDelivery'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get webhook delivery
      tags:
      - Webhooks
  /webhook-deliveries/{id}/redeliver:
    post:
      description: Sends the payload of an earlier delivery again now as a new delivery
        (one attempt)
      parameters:
      - description: Delivery ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'success, data: WebhookDelivery'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Redeliver webhook delivery
      tags:
      - Webhooks
  /webhooks:
    get:
      description: List outbound webhooks (admin only)
      parameters:
      - description: Only active (true) or inactive (false) webhooks
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 'success, data: []Webhook'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid filter
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Admin access required
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List webhooks
      tags:
      - Webhooks
    post:
      consumes:
      - application/json
      description: Create an outbound webhook; deliveries are signed with X-Webhook-Signature
        (sha256=HMAC of the body) when a secret is set. The secret and custom header
        values are stored encrypted and never returned (responses carry secret_hint
        and header_hints). URLs whose host is a loopback, private, link-local or other
        internal IP address (or localhost) are rejected unless GOATFLOW_WEBHOOK_ALLOW_PRIVATE_TARGETS=true.
      parameters:
      - description: name, url, events (required); secret, headers (object name ->
          value), retry_count, timeout_seconds, is_active
        in: body
        name: webhook
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: 'success, data: Webhook'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Name already used
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create webhook
      tags:
      - Webhooks
  /webhooks/{id}:
    delete:
      description: Deletes the webhook and its delivery log
      parameters:
      - description: Webhook ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Deleted
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete webhook
      tags:
      - Webhooks
    get:
      parameters:
      - description: Webhook ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'success, data: Webhook'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get webhook
      tags:
      - Webhooks
    put:
      consumes:
      - application/json
      description: 'Partial update: only fields present change; an empty secret removes
        it. headers replaces the custom headers: a null value keeps the stored value
        of that header, headers left out are removed; omit headers to keep them all.'
      parameters:
      - description: Webhook ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to change
        in: body
        name: webhook
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 'success, data: Webhook'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Name already used
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update webhook
      tags:
      - Webhooks
  /webhooks/{id}/deliveries:
    get:
      description: Newest deliveries first, without payload and response bodies
      parameters:
      - description: Webhook ID
        in: path
        name: id
        required: true
        type: integer
      - description: 1-200, default 50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'success, data: []WebhookDelivery'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List webhook deliveries
      tags:
      - Webhooks
  /webhooks/{id}/test:
    post:
      description: Sends a webhook.test event now (one attempt) and returns the recorded
        delivery
      parameters:
      - description: Webhook ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'success, data: WebhookDelivery'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Send test delivery
      tags:
      - Webhooks
  /webhooks/events:
    get:
      description: Events a webhook can subscribe to
      produces:
      - application/json
      responses:
        "200":
          description: 'success, data: [{event, description}]'
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List webhook events
      tags:
      - Webhooks
securityDefinitions:
  BearerAuth:
    description: API token (Bearer gf_xxx) or JWT token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
