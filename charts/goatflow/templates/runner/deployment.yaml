{{- if .Values.runner.enabled }}
{{- /* Background runner: email queue, webhook dispatch, session cleanup. No Service. */ -}}
{{- if gt (int .Values.runner.replicaCount) 1 }}
{{- fail "runner.replicaCount must be 0 or 1: runner tasks take no lock across processes, so a second runner sends queued email twice" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goatflow.fullname" . }}-runner
  labels:
    {{- include "goatflow.runner.labels" . | nindent 4 }}
    {{- with .Values.global.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.runner.replicaCount }}
  strategy:
    # Never run two runners at once while rolling out
    type: Recreate
  selector:
    matchLabels:
      {{- include "goatflow.runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.runner.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "goatflow.runner.selectorLabels" . | nindent 8 }}
        {{- with .Values.global.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.runner.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.runner.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "goatflow.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      {{- include "goatflow.waitForDatabase" . | nindent 6 }}
      containers:
        - name: runner
          image: {{ include "goatflow.runner.image" . }}
          imagePullPolicy: {{ .Values.runner.image.pullPolicy }}
          command: ["./goats", "-mode", "runner"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            {{- include "goatflow.commonEnv" . | nindent 12 }}
            {{- with .Values.runner.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
          volumeMounts:
            # Writable paths on the read-only root filesystem
            - name: tmp
              mountPath: /tmp
            - name: app-tmp
              mountPath: /app/tmp
            - name: cache
              mountPath: /home/appuser/.cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
      {{- with .Values.runner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
