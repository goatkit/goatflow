{{- $ldap := .Values.config.ldap }}
{{- if and $ldap.enabled $ldap.bindPassword (not $ldap.existingSecret) .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "goatflow.ldap.secretName" . }}
  labels:
    {{- include "goatflow.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $ldap.existingSecretKey }}: {{ $ldap.bindPassword | b64enc | quote }}
{{- end }}
{{- if and $ldap.enabled $ldap.caCert }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "goatflow.fullname" . }}-ldap-ca
  labels:
    {{- include "goatflow.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- $ldap.caCert | nindent 4 }}
{{- end }}
