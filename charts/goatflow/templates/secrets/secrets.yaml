{{- if .Values.secrets.create }}
{{- /* Database secret: values left empty are generated once and kept on upgrade. Kept on
helm uninstall like the database volume, so a reinstall still has the volume's password. */ -}}
{{- if not .Values.database.external.enabled }}
{{- $name := printf "%s-database" (include "goatflow.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "goatflow.database.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- if eq .Values.database.type "mysql" }}
  mysql-root-password: {{ include "goatflow.secretValue" (dict "ctx" . "secret" $name "key" "mysql-root-password" "value" .Values.database.mysql.rootPassword "generate" (randAlphaNum 32)) | quote }}
  mysql-user: {{ .Values.database.mysql.user | b64enc | quote }}
  mysql-password: {{ include "goatflow.secretValue" (dict "ctx" . "secret" $name "key" "mysql-password" "value" .Values.database.mysql.password "generate" (randAlphaNum 32)) | quote }}
{{- else }}
  postgres-user: {{ .Values.database.postgresql.user | b64enc | quote }}
  postgres-password: {{ include "goatflow.secretValue" (dict "ctx" . "secret" $name "key" "postgres-password" "value" .Values.database.postgresql.password "generate" (randAlphaNum 32)) | quote }}
{{- end }}
{{- end }}
{{- /* External Valkey password given inline */ -}}
{{- if and .Values.externalValkey.enabled .Values.externalValkey.password (not .Values.externalValkey.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "goatflow.fullname" . }}-valkey-external
  labels:
    {{- include "goatflow.labels" . | nindent 4 }}
type: Opaque
data:
  valkey-password: {{ .Values.externalValkey.password | b64enc | quote }}
{{- end }}
{{- end }}
