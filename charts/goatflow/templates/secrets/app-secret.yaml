{{- with .Values.secrets.secureKey }}
{{- if not (regexMatch "^[0-9a-fA-F]{64}$" .) }}
{{- fail "secrets.secureKey must be exactly 64 hex characters (openssl rand -hex 32)" }}
{{- end }}
{{- end }}
{{- with .Values.secrets.appSecretKey }}
{{- if lt (len .) 32 }}
{{- fail "secrets.appSecretKey (JWT_SECRET) must be at least 32 characters" }}
{{- end }}
{{- end }}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- $name := include "goatflow.appSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "goatflow.labels" . | nindent 4 }}
type: Opaque
data:
  # JWT_SECRET
  app-secret-key: {{ include "goatflow.secretValue" (dict "ctx" . "secret" $name "key" "app-secret-key" "value" .Values.secrets.appSecretKey "generate" (randAlphaNum 64)) | quote }}
  # GOATFLOW_SECURE_KEY: 64 hex characters, generated once and never rotated by the chart
  secure-key: {{ include "goatflow.secretValue" (dict "ctx" . "secret" $name "key" "secure-key" "value" .Values.secrets.secureKey "generate" (randAlphaNum 64 | sha256sum)) | quote }}
  # GOATFLOW_ADMIN_PASSWORD: first-boot password of the admin account root@localhost
  admin-password: {{ include "goatflow.secretValue" (dict "ctx" . "secret" $name "key" "admin-password" "value" .Values.secrets.adminPassword "generate" (randAlphaNum 24)) | quote }}
  {{- if and .Values.config.email.smtp.password (not .Values.config.email.smtp.existingSecret) }}
  smtp-password: {{ .Values.config.email.smtp.password | b64enc | quote }}
  {{- end }}
{{- end }}
