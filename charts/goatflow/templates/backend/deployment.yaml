{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goatflow.fullname" . }}-backend
  labels:
    {{- include "goatflow.backend.labels" . | nindent 4 }}
    {{- with .Values.global.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "goatflow.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "goatflow.backend.selectorLabels" . | nindent 8 }}
        {{- with .Values.global.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "goatflow.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      {{- include "goatflow.waitForDatabase" . | nindent 6 }}
      containers:
        - name: backend
          image: {{ include "goatflow.backend.image" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          env:
            {{- include "goatflow.commonEnv" . | nindent 12 }}
            - name: APP_PORT
              value: "8080"
            # One-shot: becomes the password of root@localhost while that seeded
            # account is still factory-disabled; ignored afterwards
            - name: GOATFLOW_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "goatflow.appSecretName" . }}
                  key: admin-password
                  optional: true
            {{- if .Values.metrics.enabled }}
            # Unauthenticated Prometheus listener on its own port
            - name: METRICS_ENABLED
              value: "true"
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            {{- end }}

            {{- with .Values.config.authProviders }}
            # Authentication provider order
            - name: AUTH_PROVIDERS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- $ldap := .Values.config.ldap }}
            {{- if $ldap.enabled }}
            {{- if not $ldap.host }}{{ fail "config.ldap.host is required when config.ldap.enabled is true" }}{{ end }}
            {{- if not $ldap.baseDN }}{{ fail "config.ldap.baseDN is required when config.ldap.enabled is true" }}{{ end }}
            {{- if and $ldap.bindDN (not (or $ldap.bindPassword $ldap.existingSecret)) }}{{ fail "config.ldap.bindDN needs config.ldap.bindPassword or config.ldap.existingSecret" }}{{ end }}
            # LDAP / Active Directory agent login (docs/LDAP.md)
            - name: LDAP_ENABLED
              value: "true"
            - name: LDAP_USE_TLS
              value: {{ $ldap.useTLS | quote }}
            - name: LDAP_USE_SSL
              value: {{ $ldap.useSSL | quote }}
            - name: LDAP_SKIP_TLS_VERIFY
              value: {{ $ldap.skipTLSVerify | quote }}
            - name: LDAP_AUTO_CREATE_USERS
              value: {{ $ldap.autoCreateUsers | quote }}
            - name: LDAP_AUTO_UPDATE_USERS
              value: {{ $ldap.autoUpdateUsers | quote }}
            {{- $optional := dict
              "LDAP_TYPE" $ldap.type "LDAP_HOST" $ldap.host "LDAP_PORT" $ldap.port "LDAP_TIMEOUT" $ldap.timeout
              "LDAP_BIND_DN" $ldap.bindDN "LDAP_BASE_DN" $ldap.baseDN "LDAP_USER_BASE_DN" $ldap.userBaseDN
              "LDAP_USER_FILTER" $ldap.userFilter "LDAP_IS_ACTIVE_DIRECTORY" $ldap.isActiveDirectory "LDAP_DOMAIN" $ldap.domain
              "LDAP_USERNAME_ATTRIBUTE" $ldap.usernameAttribute "LDAP_EMAIL_ATTRIBUTE" $ldap.emailAttribute
              "LDAP_FIRST_NAME_ATTRIBUTE" $ldap.firstNameAttribute "LDAP_LAST_NAME_ATTRIBUTE" $ldap.lastNameAttribute
              "LDAP_DISPLAY_NAME_ATTRIBUTE" $ldap.displayNameAttribute "LDAP_GROUP_BASE_DN" $ldap.groupBaseDN
              "LDAP_GROUP_FILTER" $ldap.groupFilter "LDAP_GROUP_MEMBER_VALUE" $ldap.groupMemberValue
              "LDAP_GROUP_ATTRIBUTE" $ldap.groupAttribute }}
            {{- range $name, $value := $optional }}
            {{- if $value }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- end }}
            {{- $lists := dict "LDAP_AGENT_GROUPS" $ldap.agentGroups "LDAP_ADMIN_GROUPS" $ldap.adminGroups "LDAP_INITIAL_GROUPS" $ldap.initialGroups }}
            {{- range $name, $value := $lists }}
            {{- if $value }}
            - name: {{ $name }}
              value: {{ join "," $value | quote }}
            {{- end }}
            {{- end }}
            {{- if $ldap.caCert }}
            - name: LDAP_TLS_CA_FILE
              value: /etc/goatflow/ldap/ca.crt
            {{- end }}
            {{- if $ldap.bindDN }}
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "goatflow.ldap.secretName" . }}
                  key: {{ $ldap.existingSecretKey }}
            {{- end }}
            {{- end }}

            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.readiness.timeoutSeconds }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            # Writable paths on the read-only root filesystem
            - name: tmp
              mountPath: /tmp
            - name: app-tmp
              mountPath: /app/tmp
            - name: cache
              mountPath: /home/appuser/.cache
            # STORAGE_PATH: fs attachments and plugin files
            - name: storage
              mountPath: {{ .Values.config.storage.path }}
            {{- if and .Values.config.ldap.enabled .Values.config.ldap.caCert }}
            - name: ldap-ca
              mountPath: /etc/goatflow/ldap
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        {{- $persistence := .Values.config.storage.persistence }}
        - name: storage
        {{- if $persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $persistence.existingClaim | default (printf "%s-storage" (include "goatflow.fullname" .)) }}
        {{- else if eq .Values.config.storage.type "fs" }}
          {{- fail "config.storage.type fs needs config.storage.persistence.enabled: attachments in an emptyDir are lost when the pod restarts" }}
        {{- else }}
          emptyDir: {}
        {{- end }}
        {{- if and .Values.config.ldap.enabled .Values.config.ldap.caCert }}
        - name: ldap-ca
          configMap:
            name: {{ include "goatflow.fullname" . }}-ldap-ca
        {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
