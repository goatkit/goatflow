# GoatFlow Helm Chart - Default Values
# MySQL is the default database

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================
global:
  # Storage class for persistent volumes (empty = cluster default)
  storageClass: ""

  # Image pull secrets for private registries
  imagePullSecrets: []

  # Common annotations applied to ALL resources
  commonAnnotations: {}

  # Common labels applied to ALL resources (merged with standard labels)
  commonLabels: {}

# =============================================================================
# BACKEND APPLICATION
# =============================================================================
backend:
  enabled: true

  image:
    repository: ghcr.io/goatkit/goatflow
    tag: ""  # Defaults to appVersion
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Liveness and readiness probes
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3

  # Extra environment variables
  extraEnv: []

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity rules
  affinity: {}

  # Pod annotations (e.g., prometheus.io/scrape, sidecar.istio.io/inject)
  podAnnotations: {}
  #  prometheus.io/scrape: "true"
  #  prometheus.io/port: "9090"

  # Additional pod labels
  podLabels: {}

  # Service annotations (e.g., AWS load balancer config)
  serviceAnnotations: {}
  #  service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

# =============================================================================
# FRONTEND (NGINX)
# =============================================================================
frontend:
  enabled: true

  image:
    repository: nginx
    tag: "1.25-alpine"
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Pod annotations
  podAnnotations: {}

  # Additional pod labels
  podLabels: {}

  # Service annotations
  serviceAnnotations: {}

# =============================================================================
# DATABASE
# =============================================================================
database:
  # Database type: mysql or postgresql
  type: mysql

  # External database (if using RDS, Cloud SQL, etc.)
  external:
    enabled: false
    host: ""
    port: ""
    database: "goatflow"
    # Reference to existing secret with keys: username, password
    existingSecret: ""

  # MySQL/MariaDB settings (when type=mysql and external.enabled=false)
  mysql:
    image:
      repository: mariadb
      tag: "11"
      pullPolicy: IfNotPresent

    # Root password - use existingSecret in production
    rootPassword: ""
    existingSecret: ""  # Secret with key: mysql-root-password

    database: goatflow
    user: goatflow
    password: ""  # Use existingSecret in production

    storage:
      size: 10Gi
      storageClass: ""  # Uses global.storageClass if empty

    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

    # MySQL configuration
    config:
      maxConnections: 200
      innodbBufferPoolSize: "256M"

    nodeSelector: {}
    tolerations: []
    affinity: {}

    # Pod annotations
    podAnnotations: {}

    # Service annotations
    serviceAnnotations: {}

  # PostgreSQL settings (when type=postgresql and external.enabled=false)
  postgresql:
    image:
      repository: postgres
      tag: "16-alpine"
      pullPolicy: IfNotPresent

    database: goatflow
    user: goatflow
    password: ""  # Use existingSecret in production
    existingSecret: ""  # Secret with key: postgres-password

    storage:
      size: 10Gi
      storageClass: ""

    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

    # PostgreSQL configuration
    config:
      maxConnections: 200
      sharedBuffers: "256MB"

    nodeSelector: {}
    tolerations: []
    affinity: {}

    # Pod annotations
    podAnnotations: {}

    # Service annotations
    serviceAnnotations: {}

# =============================================================================
# VALKEY (Redis-compatible cache)
# =============================================================================
valkey:
  enabled: true

  # External Valkey/Redis (if using ElastiCache, etc.)
  # Set enabled=false and configure externalValkey below

  # Values passed to valkey subchart
  # See https://github.com/valkey-io/valkey-helm for all options

  # Authentication via ACL
  auth:
    enabled: true
    # ACL configuration for default user
    # Password should be set via --set valkey.auth.aclConfig in production
    # Format: user <username> on ><password> ~* &* +@all
    aclConfig: "user default on >changeme ~* &* +@all"

  persistence:
    enabled: true
    size: 1Gi

# External Valkey/Redis configuration
externalValkey:
  enabled: false
  host: ""
  port: 6379
  password: ""
  existingSecret: ""

# =============================================================================
# INGRESS
# =============================================================================
ingress:
  enabled: false
  className: nginx

  annotations: {}
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"

  hosts:
    - host: goatflow.local
      paths:
        - path: /
          pathType: Prefix

  tls: []
    # - secretName: goatflow-tls
    #   hosts:
    #     - goatflow.local

# =============================================================================
# SERVICE ACCOUNT
# =============================================================================
serviceAccount:
  create: true
  name: ""  # Defaults to release name
  annotations: {}

# =============================================================================
# SECRETS
# =============================================================================
secrets:
  # Create secrets from values (NOT recommended for production)
  # In production, create secrets manually or use external-secrets
  create: true

  # Application secret key for sessions/JWT
  appSecretKey: ""  # Auto-generated if empty

# =============================================================================
# GoatFlow APPLICATION CONFIG
# =============================================================================
config:
  # Log level: debug, info, warn, error
  logLevel: info

  # Public URL users reach GoatFlow at, e.g. https://helpdesk.example.com
  # (BASE_URL). Password-reset and customer sign-up emails link to it and are
  # not sent while it is empty.
  baseUrl: ""

  # Session configuration
  session:
    lifetime: 28800  # 8 hours in seconds

  # Article attachment storage (STORAGE_TYPE / STORAGE_PATH)
  storage:
    # db (ArticleStorageDB) keeps attachments in the database. fs
    # (ArticleStorageFS) needs a persistent volume at <path>/var/article,
    # which this chart does not provision, so keep db unless you add one.
    type: db
    path: /data/storage

  # Email configuration
  email:
    enabled: false
    smtp:
      host: ""
      port: 587
      username: ""
      password: ""
      from: "goatflow@example.com"

  # Authentication provider order (AUTH_PROVIDERS). Empty keeps the image's
  # Config.yaml Auth::Providers (database only). With LDAP: ["ldap", "database"].
  authProviders: []

  # LDAP / Active Directory agent login (LDAP_* variables, see docs/LDAP.md).
  # Also add "ldap" to authProviders. Empty values use GoatFlow's defaults
  # (or the LDAP_TYPE defaults); invalid settings stop the backend at startup.
  ldap:
    enabled: false
    # openldap | 389ds | active_directory
    type: ""
    host: ""
    # Default 389, or 636 with useSSL
    port: ""
    # StartTLS (useTLS) or LDAPS (useSSL); the server certificate is verified
    useTLS: true
    useSSL: false
    # PEM CA certificate(s) for the server certificate, mounted into the pod
    # and passed as LDAP_TLS_CA_FILE. Empty uses the system roots.
    caCert: ""
    # Testing only: do not verify the server certificate
    skipTLSVerify: false
    # Seconds per connect / LDAP operation
    timeout: ""
    # Service account for searches (empty = anonymous search)
    bindDN: ""
    # Service account password: set existingSecret (key existingSecretKey),
    # or bindPassword to let the chart create a Secret (secrets.create).
    bindPassword: ""
    existingSecret: ""
    existingSecretKey: ldap-bind-password
    baseDN: ""
    userBaseDN: ""
    # Exactly one %s, replaced by the escaped login
    userFilter: ""
    # "true"/"false"; empty uses the type default
    isActiveDirectory: ""
    # Active Directory: also match <login>@<domain>
    domain: ""
    usernameAttribute: ""
    emailAttribute: ""
    firstNameAttribute: ""
    lastNameAttribute: ""
    displayNameAttribute: ""
    groupBaseDN: ""
    groupFilter: ""
    # dn | username
    groupMemberValue: ""
    groupAttribute: ""
    # Only members of these groups (or adminGroups) may log in
    agentGroups: []
    # GoatFlow admin group membership follows membership of these groups
    adminGroups: []
    # Create the agent on first LDAP login / sync name and email on each login
    autoCreateUsers: false
    autoUpdateUsers: false
    # GoatFlow groups given to auto-created agents (default: users)
    initialGroups: []

# =============================================================================
# EXTRA RESOURCES
# =============================================================================
# Define arbitrary Kubernetes resources with full Helm templating support.
# Resources are processed through tpl, so you can use:
#   {{ .Release.Name }}, {{ .Release.Namespace }}, {{ .Values.* }},
#   {{ .Chart.AppVersion }}, {{ include "goatflow.labels" . }}, etc.
#
# IMPORTANT: Strings containing {{ must be quoted in YAML
#
# Example:
#   extraResources:
#     - apiVersion: v1
#       kind: ConfigMap
#       metadata:
#         name: "{{ .Release.Name }}-custom-config"
#         labels:
#           {{- include "goatflow.labels" . | nindent 10 }}
#       data:
#         app-version: "{{ .Chart.AppVersion }}"
#
#     - apiVersion: policy/v1
#       kind: PodDisruptionBudget
#       metadata:
#         name: "{{ .Release.Name }}-backend-pdb"
#       spec:
#         minAvailable: 1
#         selector:
#           matchLabels:
#             app.kubernetes.io/name: goatflow
#             app.kubernetes.io/component: backend
#
extraResources: []
