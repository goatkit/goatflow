# GoatFlow Helm Chart - Default Values
# MySQL is the default database

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================
global:
  # Storage class for persistent volumes (empty = cluster default)
  storageClass: ""

  # Image pull secrets for private registries
  imagePullSecrets: []

  # Common annotations applied to ALL resources
  commonAnnotations: {}

  # Common labels applied to ALL resources (merged with standard labels)
  commonLabels: {}

# =============================================================================
# BACKEND APPLICATION
# =============================================================================
# Serves the agent UI, the customer portal (/customer), the REST API and
# /health on port 8080, runs migrations at start and runs the in-process
# scheduler. The Ingress sends every path here.
backend:
  enabled: true

  image:
    repository: ghcr.io/goatkit/goatflow
    tag: ""  # Defaults to appVersion
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 8080

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Liveness and readiness probes
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3

  # Graceful stop: HTTP drain (DRAIN_TIMEOUT, default 5s) + plugin shutdown
  # (up to 30s). Keep >= DRAIN_TIMEOUT + 40s.
  terminationGracePeriodSeconds: 45

  # Extra environment variables
  extraEnv: []

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity rules
  affinity: {}

  # Pod annotations (e.g., sidecar.istio.io/inject)
  podAnnotations: {}

  # Additional pod labels
  podLabels: {}

  # Service annotations (e.g., AWS load balancer config)
  serviceAnnotations: {}
  #  service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

# =============================================================================
# BACKGROUND RUNNER
# =============================================================================
# `goats -mode runner`: sends the outgoing email queue (mail_queue), delivers
# webhooks and cleans up expired sessions. Gets the same database, secrets and
# email settings as the backend; no Service. Keep one replica.
runner:
  enabled: true

  image:
    repository: ghcr.io/goatkit/goatflow-runner
    tag: ""  # Defaults to appVersion
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  # Running tasks are cancelled on SIGTERM and given DRAIN_TIMEOUT (default 5s)
  terminationGracePeriodSeconds: 45

  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

# =============================================================================
# METRICS
# =============================================================================
# Unauthenticated Prometheus listener on its own port (METRICS_ENABLED /
# METRICS_PORT on the backend) and a <fullname>-metrics Service. /metrics on
# the app port always exists but needs an admin login.
metrics:
  enabled: false
  port: 9090
  service:
    annotations: {}
    #  prometheus.io/scrape: "true"
    #  prometheus.io/port: "9090"

# Init container that waits until the bundled database accepts connections
waitForDatabase:
  image:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent

# =============================================================================
# DATABASE
# =============================================================================
database:
  # Database type: mysql or postgresql
  type: mysql

  # External database (if using RDS, Cloud SQL, etc.)
  external:
    enabled: false
    host: ""
    port: ""
    database: "goatflow"
    # Existing Secret with the user name and password. Keys:
    #   type mysql:      mysql-user, mysql-password
    #   type postgresql: postgres-user, postgres-password
    existingSecret: ""

  # MySQL/MariaDB settings (when type=mysql and external.enabled=false)
  mysql:
    image:
      repository: mariadb
      tag: "11"
      pullPolicy: IfNotPresent

    # Passwords: generated once and kept across upgrades when empty
    rootPassword: ""
    # Existing Secret with keys mysql-root-password, mysql-user, mysql-password
    existingSecret: ""

    database: goatflow
    user: goatflow
    password: ""

    storage:
      size: 10Gi
      storageClass: ""  # Uses global.storageClass if empty

    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

    # MySQL configuration
    config:
      maxConnections: 200
      innodbBufferPoolSize: "256M"

    nodeSelector: {}
    tolerations: []
    affinity: {}

    # Pod annotations
    podAnnotations: {}

    # Service annotations
    serviceAnnotations: {}

  # PostgreSQL settings (when type=postgresql and external.enabled=false)
  postgresql:
    image:
      repository: postgres
      tag: "16-alpine"
      pullPolicy: IfNotPresent

    database: goatflow
    user: goatflow
    # Generated once and kept across upgrades when empty
    password: ""
    # Existing Secret with keys postgres-user, postgres-password
    existingSecret: ""

    storage:
      size: 10Gi
      storageClass: ""

    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

    # PostgreSQL configuration
    config:
      maxConnections: 200
      sharedBuffers: "256MB"

    nodeSelector: {}
    tolerations: []
    affinity: {}

    # Pod annotations
    podAnnotations: {}

    # Service annotations
    serviceAnnotations: {}

# =============================================================================
# VALKEY (Redis-compatible cache)
# =============================================================================
# Values below are passed to the valkey subchart
# (https://github.com/valkey-io/valkey-helm). GoatFlow connects to the
# <release>-valkey Service through GOATFLOW_VALKEY_HOST / _PORT / _PASSWORD.
valkey:
  enabled: true

  # Off by default: Valkey is only reachable inside the cluster (ClusterIP).
  # To require a password, define the "default" ACL user; GoatFlow reads its
  # password from the subchart Secret <release>-valkey-auth (key
  # default-password), or from usersExistingSecret (key passwordKey):
  #   auth:
  #     enabled: true
  #     aclUsers:
  #       default:
  #         permissions: "~* &* +@all"
  #         password: "a-long-random-password"
  auth:
    enabled: false

# External Valkey/Redis instead of the subchart (set valkey.enabled=false)
externalValkey:
  enabled: false
  host: ""
  port: 6379
  # Password: existingSecret (key existingSecretPasswordKey), or password to
  # let the chart create a Secret (secrets.create)
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: valkey-password

# =============================================================================
# INGRESS
# =============================================================================
# Every path goes to the backend Service (agent UI, customer portal, API).
ingress:
  enabled: false
  className: nginx

  annotations: {}
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"

  hosts:
    - host: goatflow.local
      paths:
        - path: /
          pathType: Prefix

  tls: []
    # - secretName: goatflow-tls
    #   hosts:
    #     - goatflow.local

# =============================================================================
# SERVICE ACCOUNT
# =============================================================================
serviceAccount:
  create: true
  name: ""  # Defaults to release name
  annotations: {}

# =============================================================================
# SECRETS
# =============================================================================
secrets:
  # Create the database and app Secrets. Values left empty are generated on
  # install and kept on every upgrade. With create=false, provide the Secrets
  # yourself (database.*.existingSecret and secrets.existingSecret).
  create: true

  # Existing app Secret (instead of <fullname>-app). Keys: app-secret-key
  # (JWT_SECRET, at least 32 characters), secure-key (GOATFLOW_SECURE_KEY,
  # 64 hex characters), optional admin-password, and smtp-password when
  # config.email.smtp.password is used.
  existingSecret: ""

  # JWT signing secret (JWT_SECRET), at least 32 characters
  appSecretKey: ""

  # Key that encrypts stored secrets (GOATFLOW_SECURE_KEY): exactly 64 hex
  # characters (openssl rand -hex 32). Shared by the backend and the runner.
  # Never change it after install: stored webhook signing secrets and plugin
  # secure settings could no longer be decrypted.
  secureKey: ""

  # First-boot password of the admin account root@localhost
  # (GOATFLOW_ADMIN_PASSWORD). Generated when empty; read it with
  #   kubectl get secret <fullname>-app -o jsonpath='{.data.admin-password}' | base64 -d
  # Applied once, while the seeded account is still disabled. Change it in
  # GoatFlow afterwards; later values here are ignored.
  adminPassword: ""

# =============================================================================
# GoatFlow APPLICATION CONFIG
# =============================================================================
config:
  # Log level (LOG_LEVEL): debug, info, warn, error
  logLevel: info

  # Public URL users reach GoatFlow at, e.g. https://helpdesk.example.com
  # (BASE_URL). Password-reset and customer sign-up emails link to it and are
  # not sent while it is empty.
  baseUrl: ""

  # Session configuration
  session:
    # Maximum session lifetime in seconds (auth.session.SessionMaxTime)
    lifetime: 28800  # 8 hours

  # File storage (STORAGE_TYPE / STORAGE_PATH): fs article attachments
  # (<path>/var/article) and plugin files (<path>/plugins)
  storage:
    # db (ArticleStorageDB) keeps attachments in the database; fs
    # (ArticleStorageFS) keeps them on the storage volume below.
    type: db
    path: /data/storage
    # Volume mounted at path on the backend (the runner does not read it).
    # Disabled: an emptyDir that is lost when the pod restarts, refused with
    # type fs. With more than one backend replica on several nodes the volume
    # must be ReadWriteMany (an RWX storage class such as NFS or CephFS):
    # a ReadWriteOnce volume attaches to one node only.
    persistence:
      enabled: true
      # Use this PVC instead of creating <fullname>-storage
      existingClaim: ""
      size: 10Gi
      storageClass: ""  # Uses global.storageClass if empty
      accessModes:
        - ReadWriteOnce

  # Outgoing email (GOATFLOW_EMAIL_*), used by the backend and the runner.
  # While disabled, mail stays in the mail_queue table.
  email:
    enabled: false
    from: "goatflow@example.com"
    fromName: ""
    smtp:
      host: ""
      port: 587
      username: ""
      # Password: existingSecret (key existingSecretKey), or password to store
      # it in the app Secret (secrets.create)
      password: ""
      existingSecret: ""
      existingSecretKey: smtp-password
      # STARTTLS
      startTLS: true
      skipVerify: false
      # plain or login
      authType: plain

  # Authentication provider order (AUTH_PROVIDERS). Empty keeps the image's
  # Config.yaml Auth::Providers (database only). With LDAP: ["ldap", "database"].
  authProviders: []

  # LDAP / Active Directory agent login (LDAP_* variables, see docs/LDAP.md).
  # Also add "ldap" to authProviders. Empty values use GoatFlow's defaults
  # (or the LDAP_TYPE defaults); invalid settings stop the backend at startup.
  ldap:
    enabled: false
    # openldap | 389ds | active_directory
    type: ""
    host: ""
    # Default 389, or 636 with useSSL
    port: ""
    # StartTLS (useTLS) or LDAPS (useSSL); the server certificate is verified
    useTLS: true
    useSSL: false
    # PEM CA certificate(s) for the server certificate, mounted into the pod
    # and passed as LDAP_TLS_CA_FILE. Empty uses the system roots.
    caCert: ""
    # Testing only: do not verify the server certificate
    skipTLSVerify: false
    # Seconds per connect / LDAP operation
    timeout: ""
    # Service account for searches (empty = anonymous search)
    bindDN: ""
    # Service account password: set existingSecret (key existingSecretKey),
    # or bindPassword to let the chart create a Secret (secrets.create).
    bindPassword: ""
    existingSecret: ""
    existingSecretKey: ldap-bind-password
    baseDN: ""
    userBaseDN: ""
    # Exactly one %s, replaced by the escaped login
    userFilter: ""
    # "true"/"false"; empty uses the type default
    isActiveDirectory: ""
    # Active Directory: also match <login>@<domain>
    domain: ""
    usernameAttribute: ""
    emailAttribute: ""
    firstNameAttribute: ""
    lastNameAttribute: ""
    displayNameAttribute: ""
    groupBaseDN: ""
    groupFilter: ""
    # dn | username
    groupMemberValue: ""
    groupAttribute: ""
    # Only members of these groups (or adminGroups) may log in
    agentGroups: []
    # GoatFlow admin group membership follows membership of these groups
    adminGroups: []
    # Create the agent on first LDAP login / sync name and email on each login
    autoCreateUsers: false
    autoUpdateUsers: false
    # GoatFlow groups given to auto-created agents (default: users)
    initialGroups: []

# =============================================================================
# EXTRA RESOURCES
# =============================================================================
# Define arbitrary Kubernetes resources with full Helm templating support.
# Resources are processed through tpl, so you can use:
#   {{ .Release.Name }}, {{ .Release.Namespace }}, {{ .Values.* }},
#   {{ .Chart.AppVersion }}, {{ include "goatflow.labels" . }}, etc.
#
# IMPORTANT: Strings containing {{ must be quoted in YAML
#
# Example:
#   extraResources:
#     - apiVersion: v1
#       kind: ConfigMap
#       metadata:
#         name: "{{ .Release.Name }}-custom-config"
#         labels:
#           {{- include "goatflow.labels" . | nindent 10 }}
#       data:
#         app-version: "{{ .Chart.AppVersion }}"
#
#     - apiVersion: policy/v1
#       kind: PodDisruptionBudget
#       metadata:
#         name: "{{ .Release.Name }}-backend-pdb"
#       spec:
#         minAvailable: 1
#         selector:
#           matchLabels:
#             app.kubernetes.io/name: goatflow
#             app.kubernetes.io/component: backend
#
extraResources: []
