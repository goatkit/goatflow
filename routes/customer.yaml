---
# Customer Routes Configuration
apiVersion: goatflow.io/v1
kind: RouteGroup
metadata:
  name: customer
  description: "Customer routes for ticket management and self-service"
  namespace: default
  enabled: true
spec:
  prefix: /customer
  middleware:
    - customer-captive-redirect  # Per-org captive plugin: redirects customers whose org is captive to another plugin before customer-portal writes the response.
    - customer-portal            # Loads portal config; handles auth per config
  routes:
    # Customer dashboard
    - path: /
      method: GET
      handler: handleCustomerDashboard
      template: pages/customer/dashboard.pongo2
      description: "Display customer dashboard with their tickets"

    # Customer tickets
    - path: /tickets
      method: GET
      handler: handleCustomerTickets
      template: pages/customer/tickets.pongo2
      description: "Display customer's ticket list"

    # New ticket creation
    - path: /tickets/new
      method: GET
      handler: handleCustomerNewTicket
      template: pages/customer/new_ticket.pongo2
      description: "Display new ticket creation form"

    - path: /tickets/create
      method: POST
      handler: handleCustomerCreateTicket
      description: "Process new ticket creation"

    # Individual ticket management
    - path: /tickets/:id
      method: GET
      handler: handleCustomerTicketView
      template: pages/customer/ticket_view.pongo2
      description: "Display customer ticket details and conversation"

    - path: /tickets/:id/reply
      method: POST
      handler: handleCustomerTicketReply
      description: "Process customer reply to ticket"

    - path: /tickets/:id/close
      method: POST
      handler: handleCustomerCloseTicket
      description: "Close customer ticket"

    # Customer profile management
    - path: /profile
      method: GET
      handler: handleCustomerProfile
      template: pages/customer/profile.pongo2
      description: "Display customer profile information"

    - path: /profile/update
      method: POST
      handler: handleCustomerUpdateProfile
      description: "Update customer profile information"

    # Own company (read-only; scoped to customer_user.customer_id)
    - path: /company
      method: GET
      handler: handleCustomerCompanyInfo
      template: pages/customer/company_info.pongo2
      description: "Display the logged-in customer's own company details"

    - path: /company/users
      method: GET
      handler: handleCustomerCompanyUsers
      template: pages/customer/company_users.pongo2
      description: "List the valid customer users of the logged-in customer's own company"

    # Preferences API
    - path: /api/preferences/language
      method: GET
      handler: handleCustomerGetLanguage
      description: "Get customer language preference"

    - path: /api/preferences/language
      method: POST
      handler: handleCustomerSetLanguage
      description: "Set customer language preference"

    - path: /api/preferences/session-timeout
      method: GET
      handler: handleCustomerGetSessionTimeout
      description: "Get customer session timeout preference"

    - path: /api/preferences/session-timeout
      method: POST
      handler: handleCustomerSetSessionTimeout
      description: "Set customer session timeout preference"

    - path: /api/preferences/theme
      method: GET
      handler: HandleGetTheme
      description: "Get customer theme preference"

    - path: /api/preferences/theme
      method: POST
      handler: HandleSetTheme
      description: "Set customer theme preference"

    # Wallpaper preference
    - path: /api/preferences/wallpaper
      method: POST
      handler: HandleSetWallpaper
      description: "Set wallpaper on/off preference for customer"

    # Coachmarks (feature spotlights) - dismiss tracking
    - path: /api/preferences/coachmarks/dismiss
      method: POST
      handler: HandleDismissCoachmark
      description: "Dismiss a coachmark tip for current customer"

    # Two-Factor Authentication (2FA/TOTP) for customers
    - path: /api/preferences/2fa/status
      method: GET
      handler: handleCustomerTOTPStatus
      description: "Get 2FA status for current customer"

    - path: /api/preferences/2fa/setup
      method: POST
      handler: handleCustomerTOTPSetup
      middleware: [demo-guard]
      description: "Initiate 2FA setup for customer - returns secret and QR code"

    - path: /api/preferences/2fa/confirm
      method: POST
      handler: handleCustomerTOTPConfirm
      middleware: [demo-guard]
      description: "Confirm 2FA setup with verification code"

    - path: /api/preferences/2fa/disable
      method: POST
      handler: handleCustomerTOTPDisable
      middleware: [demo-guard]
      description: "Disable 2FA for customer (requires valid code)"

    - path: /api/preferences/2fa/recovery-codes
      method: POST
      handler: handleCustomerRecoveryCodesRegenerate
      middleware: [demo-guard]
      description: "Replace customer recovery codes (password required)"

    - path: /api/preferences/2fa/webauthn/register/begin
      method: POST
      handler: handleCustomerWebAuthnRegisterBegin
      middleware: [demo-guard]
      description: "Begin customer hardware security key registration"

    - path: /api/preferences/2fa/webauthn/register/finish
      method: POST
      handler: handleCustomerWebAuthnRegisterFinish
      middleware: [demo-guard]
      description: "Finish customer hardware security key registration"

    - path: /api/preferences/2fa/webauthn/credentials
      method: GET
      handler: handleCustomerWebAuthnCredentials
      description: "List customer hardware security keys"

    - path: /api/preferences/2fa/webauthn/credentials/:id
      method: PATCH
      handler: handleCustomerWebAuthnCredentialRename
      middleware: [demo-guard]
      description: "Rename a customer hardware security key"

    - path: /api/preferences/2fa/webauthn/credentials/:id
      method: DELETE
      handler: handleCustomerWebAuthnCredentialDelete
      middleware: [demo-guard]
      description: "Remove a customer hardware security key"

    # Password management
    - path: /password/form
      method: GET
      handler: handleCustomerPasswordForm
      template: pages/customer/password_form.pongo2
      middleware: [demo-guard]
      description: "Display password change form"

    - path: /password/change
      method: POST
      handler: handleCustomerChangePassword
      middleware: [demo-guard]
      description: "Process password change"


    # Ticket attachments
    - path: /tickets/:id/attachments
      method: GET
      handler: handleCustomerGetAttachments
      description: "Get attachments for a customer ticket"

    - path: /tickets/:id/attachments
      method: POST
      handler: handleCustomerUploadAttachment
      description: "Upload attachment to a customer ticket"

    - path: /tickets/:id/articles/:article_id/attachments/:file_id
      method: GET
      handler: handleCustomerDownloadAttachment
      description: "Download an attachment of a customer-visible article (?download=1 forces a download)"

    - path: /tickets/:id/articles/:article_id/attachments/:file_id/thumbnail
      method: GET
      handler: handleCustomerGetThumbnail
      description: "Get a PNG thumbnail of an attachment"

    - path: /tickets/:id/articles/:article_id/attachments/:file_id/view
      method: GET
      handler: handleCustomerViewAttachment
      description: "View attachment in a viewer page (?raw=1 serves the embeddable content)"
