---
# Authentication Routes Configuration
apiVersion: v1
kind: RouteGroup
metadata:
  name: auth
  description: "Authentication routes for login/logout"
  namespace: default
  enabled: true
spec:
  prefix: ""
  middleware: []
  routes:
    # Main login page - shows HTMX login form
    - path: /login
      method: GET
      handler: handleLoginPage
      template: pages/login.pongo2
      description: "Display login page with HTMX form"

    # Login API endpoint - handles form submission
    - path: /api/auth/login
      method: POST
      handler: handleAuthLogin
      description: "Process login form submission via HTMX"

    # Passkey login endpoints - passwordless WebAuthn ceremony
    - path: /api/auth/passkey/begin
      method: POST
      handler: handlePasskeyLoginBegin
      description: "Begin agent passkey login"

    - path: /api/auth/passkey/finish
      method: POST
      handler: handlePasskeyLoginFinish
      description: "Finish agent passkey login"

    # Logout endpoint
    - path: /api/auth/logout
      method: POST
      handler: handleLogout
      middleware:
        - auth  # Require authentication for logout
      description: "Process logout request"

    # GET logout route for frontend redirects
    - path: /logout
      method: GET
      handler: handleLogoutRedirect
      description: "GET logout route that redirects to login"


    # Token refresh stub (returns 200 with not implemented message)
    - path: /api/auth/refresh
      method: POST
      handler: handleAuthRefresh
      description: "Placeholder for token refresh"

    # Registration stub (self-service disabled)
    - path: /api/auth/register
      method: POST
      handler: handleAuthRegister
      description: "Placeholder for user registration"

    # Customer login page
    - path: /auth/customer
      method: GET
      handler: handleCustomerLoginPage
      template: pages/customer/login.pongo2
      description: "Customer login portal"

    - path: /customer/login
      method: GET
      handler: handleCustomerLoginPage
      template: pages/customer/login.pongo2
      description: "Alias customer login path"

    - path: /customer/login
      method: POST
      handler: handleCustomerLogin
      description: "Process customer login form (alias)"

    # Customer login submit
    - path: /api/auth/customer/login
      method: POST
      handler: handleCustomerLogin
      description: "Process customer login form"

    - path: /api/auth/customer/passkey/begin
      method: POST
      handler: handleCustomerPasskeyLoginBegin
      description: "Begin customer passkey login"

    - path: /api/auth/customer/passkey/finish
      method: POST
      handler: handleCustomerPasskeyLoginFinish
      description: "Finish customer passkey login"

    # Customer logout (no auth middleware)
    # Must clear cookies before middleware runs
    - path: /customer/logout
      method: GET
      handler: handleCustomerLogout
      description: "Customer logout - clears cookies and redirects"

    # Two-Factor Authentication page and verification during login (Agent)
    - path: /login/2fa
      method: GET
      handler: handle2FAPage
      template: pages/login_2fa.pongo2
      description: "Display 2FA verification page during login"

    - path: /api/auth/2fa/verify
      method: POST
      handler: handle2FAVerify
      description: "Verify 2FA code and complete login"

    - path: /api/auth/2fa/webauthn/begin
      method: POST
      handler: handleWebAuthnLoginBegin
      description: "Begin security key login verification"

    - path: /api/auth/2fa/webauthn/finish
      method: POST
      handler: handleWebAuthnLoginFinish
      description: "Finish security key login verification"

    # Customer Two-Factor Authentication during login
    - path: /customer/login/2fa
      method: GET
      handler: handleCustomer2FAPage
      template: pages/customer/login_2fa.pongo2
      description: "Display customer 2FA verification page during login"

    - path: /api/auth/customer/2fa/verify
      method: POST
      handler: handleCustomer2FAVerify
      description: "Verify customer 2FA code and complete login"

    - path: /api/auth/customer/2fa/webauthn/begin
      method: POST
      handler: handleCustomerWebAuthnLoginBegin
      description: "Begin customer security key login verification"

    - path: /api/auth/customer/2fa/webauthn/finish
      method: POST
      handler: handleCustomerWebAuthnLoginFinish
      description: "Finish customer security key login verification"

    # OIDC/OAuth2 identity provider login flows
    - path: /auth/:id
      method: GET
      handler: handleOIDCRedirect
      description: "Redirect to IdP for OIDC/OAuth2 authentication"
    - path: /auth/:id/callback
      method: GET
      handler: handleOIDCCallback
      description: "Handle OIDC/OAuth2 callback from IdP"

    # SAML2 identity provider login flows
    - path: /auth/:id/saml
      method: GET
      handler: handleSAMLRedirect
      description: "Initiate SAML2 SP-initiated login flow"
    - path: /auth/:id/acs
      method: POST
      handler: handleSAMLCallback
      description: "Handle SAML2 ACS POST response from IdP"
    - path: /auth/:id/metadata
      method: GET
      handler: handleSAMLMetadata
      description: "Serve SAML2 SP metadata XML for IdP auto-configuration"

