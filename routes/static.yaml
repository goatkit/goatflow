---
# Static File Routes Configuration
apiVersion: goatflow.io/v1
kind: RouteGroup
metadata:
  name: static
  description: "Static routes for CSS, JS, images, and web assets"
  namespace: default
  enabled: true
spec:
  prefix: ""
  middleware: []
  routes:
    # PWA files (must be before catch-all)
    - path: /manifest.json
      method: GET
      handler: handleStaticFiles
      description: "Serve PWA web app manifest"

    - path: /sw.js
      method: GET
      handler: handleStaticFiles
      description: "Serve service worker"

    - path: /sw-config.json
      method: GET
      handler: handleServiceWorkerConfig
      description: "Serve service worker cache configuration"

    # Favicon files (must be before catch-all)
    - path: /favicon.ico
      method: GET
      handler: handleStaticFiles
      description: "Serve favicon.ico file"

    - path: /favicon.svg
      method: GET
      handler: handleStaticFiles
      description: "Serve favicon.svg file"

    # Single catch-all for all static files (supports subdirectories)
    - path: /static/*filepath
      method: GET
      handler: handleStaticFiles
      description: "Serve all static files including css, js, images, webfonts"
