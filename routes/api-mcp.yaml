---
# MCP (Model Context Protocol) routes
# Enables AI assistants to interact with GoatFlow via API tokens
apiVersion: goatflow.io/v1
kind: RouteGroup
metadata:
    name: api-mcp
    description: "Model Context Protocol endpoint for AI assistant integration"
    namespace: default
    enabled: true
spec:
    prefix: /api
    routes:
        - path: /mcp
          method: POST
          handler: HandleMCP
          middleware:
              - api_token
          description: "MCP JSON-RPC endpoint"

        - path: /mcp
          method: GET
          handler: HandleMCPInfo
          description: "MCP endpoint info"

        # MCP Streamable HTTP transport (SSE) — MCP 2025-03-26 spec
        - path: /mcp/sse
          method: POST
          handler: HandleMCPSSE
          middleware:
              - unified_auth
          description: "MCP Streamable HTTP endpoint (client-to-server)"

        - path: /mcp/sse
          method: GET
          handler: HandleMCPSSEStream
          middleware:
              - unified_auth
          description: "MCP SSE notification stream (server-to-client)"

        - path: /mcp/sse
          method: DELETE
          handler: HandleMCPSSEDelete
          middleware:
              - unified_auth
          description: "MCP session termination"
