---
# Basic Routes Configuration
apiVersion: v1
kind: RouteGroup
metadata:
    name: basic
    description: "Basic system routes (root, health, metrics, etc.)"
    namespace: default
    enabled: true
spec:
    prefix: ""
    middleware: []
    routes:
        # Root path - redirect to login
        - path: /
          method: GET
          handler: handleRoot
          description: "Root path redirects to login"

        # Health check endpoint
        - path: /health
          method: GET
          handler: handleHealthCheck
          description: "Basic health check endpoint"

        # Detailed health check — admin-gated operator endpoint (build info,
        # uptime, cache state). Docker/TrueNAS/k8s probes use /health.
        # "auth" validates the session/JWT and resolves user_role; "admin"
        # then enforces admin-group membership (gf_* API tokens are skipped
        # by "auth" without setting user_role, so they get 401 — fail closed).
        - path: /health/detailed
          method: GET
          handler: handleDetailedHealthCheck
          middleware:
              - auth
              - admin
          description: "Detailed health check with component status (admin only)"

        # Metrics endpoint — admin-gated. Prometheus scrapers use the
        # unauthenticated METRICS_PORT listener (internal network, not
        # published); the app-port route is for operator debugging.
        - path: /metrics
          method: GET
          handler: handleMetrics
          middleware:
              - auth
              - admin
          description: "Prometheus metrics endpoint (admin only)"

        # Queues redirect - redirects to appropriate queues based on user role
        - path: /queues
          method: GET
          handler: handleQueuesRedirect
          middleware:
              - auth
              - queue_ro # Require read access to at least one queue
          description: "Role-aware redirect/render for queues"

        # Queue detail page - shows tickets filtered by queue
        - path: /queues/:id
          method: GET
          handler: HandleQueueDetail
          template: pages/tickets.pongo2
          middleware:
              - auth
              - queue_access_ro # Require read access to the specific queue
          description: "Display tickets filtered by specific queue"

        # Queue metadata partial (used by HX requests)
        - path: /queues/:id/meta
          method: GET
          handler: handleQueueMetaPartial
          middleware:
              - auth
              - queue_access_ro # Require read access to the specific queue
          description: "Render queue metadata panel or JSON payload"

        # Unified ticket detail view
        - path: /ticket/:id
          method: GET
          handler: handleTicketDetail
          middleware:
              - auth
              - ticket_access_ro # Require read access to ticket's queue
          description: "Display ticket detail using the unified handler"

        # Ticket creation routes
        - path: /ticket/new
          method: GET
          handler: handleNewTicket
          template: pages/tickets/new.pongo2
          middleware:
              - auth
              - queue_create # Require create access to at least one queue
          description: "Redirect to email ticket creation form"

        - path: /ticket/new/email
          method: GET
          handler: handleNewEmailTicket
          template: pages/tickets/new.pongo2
          middleware:
              - auth
              - queue_create # Require create access to at least one queue
          description: "Display email ticket creation form"

        - path: /ticket/new/phone
          method: GET
          handler: handleNewPhoneTicket
          template: pages/tickets/new.pongo2
          middleware:
              - auth
              - queue_create # Require create access to at least one queue
          description: "Display phone ticket creation form"

        # Lightweight liveness endpoint
        - path: /healthz
          method: GET
          handler: handleHealthCheck
          description: "Quick liveness probe"

        # Public language API - for login page language selector
        - path: /api/languages
          method: GET
          handler: HandleGetAvailableLanguages
          description: "Get available languages and current preference (no auth required)"

        - path: /api/languages
          method: POST
          handler: HandleSetPreLoginLanguage
          description: "Set language preference cookie (no auth required)"

        # Public theme API - for login page theme selector
        - path: /api/themes
          method: GET
          handler: HandleGetAvailableThemes
          description: "Get available themes and current preference (no auth required)"

        - path: /api/themes
          method: POST
          handler: HandleSetPreLoginTheme
          description: "Set theme and mode preference cookies (no auth required)"
