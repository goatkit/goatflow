name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    # Weekly security scan (Sundays midnight)
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  issues: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
  # ─────────────────────────────────────────────
  # Secret Scanning
  # ─────────────────────────────────────────────
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gitleaks-report
          path: |
            gitleaks-report.json
            gitleaks-report.sarif
          retention-days: 30

  # ─────────────────────────────────────────────
  # Security & Code Quality
  # ─────────────────────────────────────────────
  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.10'

      - name: Install libvips (required for govips)
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Run gosec security scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
          mkdir -p security-artifacts
          gosec -fmt=json -out=security-artifacts/gosec-report.json ./... || true
          gosec -fmt=text ./... || echo "Security issues found - see gosec-report.json"

      - name: Run go vet
        run: go vet ./...

      - name: Upload security artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: security-artifacts
          path: security-artifacts
          retention-days: 30

  # ─────────────────────────────────────────────
  # Tests
  # ─────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    environment: Development
    env:
      CONTAINER_CMD: docker
      CACHE_USE_VOLUMES: "1"
      TEST_DB_MYSQL_PASSWORD: ${{ secrets.TEST_DB_MYSQL_PASSWORD }}
      TEST_DB_ROOT_PASSWORD: ${{ secrets.TEST_DB_ROOT_PASSWORD }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SESSION_SECRET: ${{ secrets.JWT_SECRET }}
      TEST_DB_DRIVER: mysql
      TEST_DB_MYSQL_HOST: mariadb-test
      TEST_DB_MYSQL_PORT: "3308"
      TEST_DB_MYSQL_NAME: otrs_test
      TEST_DB_MYSQL_USER: otrs
      TEST_BACKEND_PORT: "18081"
      VALKEY_TEST_PORT: "6389"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare directories and volumes
        run: |
          mkdir -p .cache tmp generated/api-map
          chmod 777 .cache tmp generated generated/api-map
          docker volume create goatflow_goatflow_cache
          docker volume create goatflow_goatflow_runtime
          docker volume create goatflow_cache
          docker run --rm -v goatflow_goatflow_cache:/vol alpine:3.19 sh -c "mkdir -p /vol/go-build /vol/go-mod /vol/xdg /vol/bun /vol/golangci-lint && chown -R 1000:1000 /vol && chmod -R 775 /vol"
          docker run --rm -v goatflow_goatflow_runtime:/vol alpine:3.19 sh -c "chown -R 1000:1000 /vol && chmod 775 /vol"
          docker run --rm -v goatflow_cache:/vol alpine:3.19 sh -c "mkdir -p /vol/go-build /vol/go-mod /vol/xdg /vol/bun /vol/golangci-lint /vol/ms-playwright && chown -R 1000:1000 /vol && chmod -R 775 /vol"

      - name: Run containerized tests
        run: make test

      - name: Generate coverage report
        run: make test-coverage
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./generated/coverage.out
          flags: unittests
          fail_ci_if_error: false
          verbose: true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-artifacts
          path: |
            /tmp/goatflow-test-*/
            tests/e2e/playwright/screenshots/
            tests/e2e/playwright/videos/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Docker Build & Push (only after tests pass)
  # ─────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test]
    if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    environment: Development
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/heads/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "branch=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ github.ref == 'refs/heads/main' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.commit }}
            GIT_BRANCH=${{ steps.version.outputs.branch }}
            BUILD_DATE=${{ steps.version.outputs.date }}
