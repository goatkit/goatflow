  /api/v1/webhooks:
    get:
      operationId: listWebhooks
      summary: List webhooks
      description: |
        Admins only (`unified_auth` + `admin`; API tokens need `admin:*`, `*`
        or no scopes and an admin owner). Returns all webhooks ordered by name,
        optionally filtered by state. Secrets are never returned.
      tags:
        - Webhooks
      parameters:
        - name: active
          in: query
          required: false
          description: |
            `true` = only active, `false` = only inactive. Parsed with Go
            `strconv.ParseBool`, so `1`, `0`, `t`, `f`, `TRUE`, `False` etc. are
            accepted too; anything else is 400.
          schema:
            type: boolean
      responses:
        '200':
          description: Webhooks ordered by name (empty array when none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createWebhook
      summary: Create webhook
      description: |
        Admins only. Creates an outbound webhook. Deliveries are POSTed as JSON
        `{event, occurred_at, data}` and signed with
        `X-Webhook-Signature: sha256=<hex HMAC-SHA256 of body>` when a secret is
        set. Defaults: `retry_count` 3, `timeout_seconds` 10, `is_active` true.
        Name and url are trimmed; duplicate events are removed.
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreateRequest'
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/webhooks/events:
    get:
