        salutation_id:
          type: integer
        signature_id:
          type: integer
        comments:
          type: string
    QueueStats:
      type: object
      required:
        - total_tickets
        - open_tickets
        - closed_tickets
        - pending_tickets
      properties:
        total_tickets:
          type: integer
        open_tickets:
          type: integer
        closed_tickets:
          type: integer
        pending_tickets:
          type: integer
    QueueMessageResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
          example: Queue deleted successfully
    Priority:
      type: object
      required:
        - id
        - name
        - color
        - valid_id
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
          example: '#cdcdcd'
        valid_id:
          type: integer
    PriorityEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/Priority'
    PriorityCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: string
          description: Default `#cdcdcd`
    PriorityUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Always written; omitting it blanks the name
        color:
          type: string
          description: Empty/omitted keeps the current color
    PriorityMessageResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - true
        message:
          type: string
          example: Priority deleted successfully
    UserMe:
      type: object
      required:
        - id
        - login
        - email
        - first_name
        - last_name
        - active
        - groups
      properties:
        id:
          type: integer
        login:
          type: string
        email:
          type: string
          description: Same as login
        first_name:
          type: string
        last_name:
          type: string
        active:
          type: boolean
          description: valid_id == 1
        groups:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/UserGroupRef'
    UserGroupRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
    WebhookEventName:
      type: string
      enum:
        - ticket.created
        - ticket.updated
        - ticket.state_changed
        - ticket.closed
        - ticket.queue_moved
        - ticket.assigned
        - ticket.priority_changed
        - ticket.merged
        - ticket.escalated
        - article.created
    WebhookHeadersInput:
      type: object
      maxProperties: 20
      description: |
        Complete set of extra HTTP headers sent with every delivery, name ->
        value; replaces the stored set (names left out are removed, `{}`
        removes all). Values are write-only (stored encrypted, never returned).
        Names: valid HTTP tokens up to 256 characters, case-insensitively
        unique; Content-Type, Content-Length, Host, User-Agent,
        X-Webhook-Signature, X-Webhook-Event and X-Webhook-Delivery are
        reserved. Values: up to 1024 characters, no control characters.
        A `null` value keeps the value currently stored under that name (400
        when none is stored, so always 400 on create).
      additionalProperties:
        type: string
        nullable: true
        maxLength: 1024
    WebhookCreateRequest:
      type: object
      required:
        - name
        - url
        - events
      properties:
        name:
          type: string
          maxLength: 200
          description: Unique name (trimmed, non-empty); duplicate is 409
        url:
          type: string
          maxLength: 2000
          description: |
            Absolute http or https URL. 400 when the host is `localhost`
            (or `*.localhost`) or a loopback, private, link-local, multicast,
            unspecified, 0.0.0.0/8, 100.64.0.0/10 or 240.0.0.0/4 IP literal,
            unless the server runs with GOATFLOW_WEBHOOK_ALLOW_PRIVATE_TARGETS=true.
            Host names are checked after DNS resolution on every delivery instead
            (a blocked address fails that delivery, not this request).
        secret:
          type: string
          description: HMAC signing secret, 16-512 characters; empty or omitted = unsigned
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventName'
        headers:
          $ref: '#/components/schemas/WebhookHeadersInput'
        retry_count:
          type: integer
          minimum: 0
          maximum: 10
          default: 3
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 60
          default: 10
        is_active:
          type: boolean
          default: true
    WebhookUpdateRequest:
      type: object
      description: Any subset of the create fields; same constraints. `secret` "" removes the secret. Omitting `headers` keeps all stored headers.
      properties:
        name:
          type: string
          maxLength: 200
        url:
          type: string
          maxLength: 2000
          description: |
            Same rules as on create: absolute http or https URL. 400 when the host is `localhost`
            (or `*.localhost`) or a loopback, private, link-local, multicast,
            unspecified, 0.0.0.0/8, 100.64.0.0/10 or 240.0.0.0/4 IP literal,
            unless the server runs with GOATFLOW_WEBHOOK_ALLOW_PRIVATE_TARGETS=true.
            Host names are checked after DNS resolution on every delivery instead
            (a blocked address fails that delivery, not this request).
        secret:
          type: string
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventName'
        headers:
          $ref: '#/components/schemas/WebhookHeadersInput'
        retry_count:
          type: integer
          minimum: 0
          maximum: 10
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 60
        is_active:
          type: boolean
    Webhook:
      type: object
      required:
        - id
        - name
        - url
        - events
        - header_hints
        - has_secret
        - retry_count
        - timeout_seconds
        - is_active
        - created_at
        - created_by
        - updated_at
        - updated_by
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventName'
        header_hints:
          type: object
          description: Custom header name -> masked hint of its value (`{}` when none). Values are never returned.
          additionalProperties:
            type: string
        has_secret:
          type: boolean
        secret_hint:
          type: string
          description: Masked hint of the secret; omitted when there is none
        retry_count:
          type: integer
        timeout_seconds:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        created_by:
          type: integer
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: integer
    WebhookResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/Webhook'
    WebhookListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
    WebhookDelivery:
      type: object
      required:
        - id
        - webhook_id
        - event
        - status
        - success
        - attempts
        - status_code
        - duration_ms
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        webhook_id:
          type: integer
          format: int64
        event:
          type: string
          description: Event name (one of the subscribable events, or `webhook.test`)
        payload:
          type: string
          description: JSON envelope sent; omitted in delivery lists and when empty
        status:
          type: string
          enum:
            - pending
            - delivering
            - delivered
            - failed
        success:
          type: boolean
        attempts:
          type: integer
        status_code:
          type: integer
          nullable: true
          description: HTTP status of the last attempt; null if no response
        response:
          type: string
          description: Response body of the last attempt (truncated to 4096 bytes); omitted in lists and when empty
        error:
          type: string
          description: Error of the last attempt; omitted when empty
        duration_ms:
          type: integer
          nullable: true
        next_attempt_at:
          type: string
          format: date-time
          description: Next retry time; omitted when none
        delivered_at:
          type: string
          format: date-time
          description: Omitted until delivered
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookDeliveryResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/WebhookDelivery'
    SearchTicket:
      type: object
      required:
        - id
        - tn
        - title
        - queue_id
        - queue
        - state_id
        - state
        - state_type
        - priority_id
        - priority
        - type_id
        - owner_id
        - responsible_id
        - lock_id
        - customer_id
        - customer_user_login
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        tn:
          type: string
          description: Ticket number
        title:
          type: string
        queue_id:
          type: integer
          format: int64
        queue:
          type: string
          description: Queue name
        state_id:
          type: integer
          format: int64
        state:
          type: string
          description: State name
        state_type:
          type: string
          description: State type name
        priority_id:
          type: integer
          format: int64
        priority:
          type: string
          description: Priority name
        type_id:
          type: integer
          format: int64
          nullable: true
        owner_id:
          type: integer
          format: int64
        responsible_id:
          type: integer
          format: int64
        lock_id:
          type: integer
          format: int64
        customer_id:
          type: string
          description: Empty string when NULL
        customer_user_login:
          type: string
          description: Empty string when NULL
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SearchResultPage:
      type: object
      required:
        - tickets
        - pagination
      properties:
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/SearchTicket'
        pagination:
          type: object
          required:
            - page
            - limit
            - total
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
              description: Total matching tickets
    SearchParameterValues:
      description: Search parameter value; text/date parameters are a single string, ID/list parameters an array of strings
      oneOf:
        - type: string
        - type: array
          items:
            type: string
    SearchParameters:
      type: object
      description: Search parameters keyed by query parameter name (same names as `GET /api/v1/search/tickets`); ID and `state_type` values are arrays of strings, others strings
      additionalProperties:
        $ref: '#/components/schemas/SearchParameterValues'
    SearchIgnoredParameters:
      type: array
      description: OTRS `profile_key`s stored for this search that are not applied (unknown to this API or with invalid values); never null
      items:
        type: string
    SearchSavedSummary:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - TicketSearch
    SearchSavedCreateRequest:
      type: object
      required:
        - name
        - parameters
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Must not be blank; must not already be used by the caller (409)
        type:
          type: string
          enum:
            - TicketSearch
          description: Optional; any other non-empty value is 400
        parameters:
          $ref: '#/components/schemas/SearchInputParameters'
    SearchSavedUpdateRequest:
      type: object
      required:
        - parameters
      properties:
        parameters:
          $ref: '#/components/schemas/SearchInputParameters'
    SearchInputParameters:
      type: object
      minProperties: 1
      description: |
        Search parameters keyed by the query parameter names of
        `GET /api/v1/search/tickets` (not page/limit/sort/order). Each value is a
        string, a number, or an array of strings/numbers; ID and `state_type`
        strings may be comma-separated. Same validation as the query; at least
        one non-empty parameter is required.
      additionalProperties:
        oneOf:
          - type: string
          - type: number
          - type: array
            items:
              oneOf:
                - type: string
                - type: number
    SearchSavedResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          required:
            - name
            - type
            - parameters
          properties:
            name:
              type: string
            type:
              type: string
              enum:
                - TicketSearch
            parameters:
              $ref: '#/components/schemas/SearchParameters'
    SearchSavedDetail:
      type: object
      required:
        - name
        - type
        - parameters
        - ignored_parameters
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - TicketSearch
        parameters:
          $ref: '#/components/schemas/SearchParameters'
        ignored_parameters:
          $ref: '#/components/schemas/SearchIgnoredParameters'
  parameters:
    TicketIdPath:
      name: id
      in: path
      required: true
      description: |
        Numeric ticket ID. (The queue-access check also resolves a ticket
        number, but the handlers accept only the numeric ID.)
      schema:
        type: integer
        format: int64
        minimum: 1
    WebhookId:
      name: id
      in: path
      required: true
      description: Webhook ID (positive integer; otherwise 400 `invalid id`)
      schema:
        type: integer
        format: int64
        minimum: 1
    WebhookDeliveryId:
      name: id
      in: path
      required: true
      description: Delivery ID (positive integer; otherwise 400 `invalid id`)
      schema:
        type: integer
        format: int64
        minimum: 1
    SearchName:
      name: name
      in: path
      required: true
      description: Saved search name (`search_profile.profile_name`, exact match)
      schema:
        type: string
    SearchQ:
      name: q
      in: query
      description: Whitespace-separated words; each must match ticket number, title, customer ID, customer user login, customer user email/first/last name, customer company name, or an article's subject, body, From or To
      schema:
        type: string
        maxLength: 200
    SearchTn:
      name: tn
      in: query
      description: Ticket number
      schema:
        type: string
        maxLength: 200
    SearchTitle:
      name: title
      in: query
      description: Ticket title
      schema:
        type: string
        maxLength: 200
    SearchCustomerId:
      name: customer_id
      in: query
      description: Customer (company) ID
      schema:
        type: string
        maxLength: 200
    SearchCustomerUserLogin:
      name: customer_user_login
      in: query
      description: Customer user login
      schema:
        type: string
        maxLength: 200
    SearchFrom:
      name: from
      in: query
      description: Any article's From
      schema:
        type: string
        maxLength: 200
    SearchTo:
      name: to
      in: query
      description: Any article's To or Cc
      schema:
        type: string
        maxLength: 200
    SearchSubject:
      name: subject
      in: query
      description: Any article's subject
      schema:
        type: string
        maxLength: 200
    SearchBody:
      name: body
      in: query
      description: Any article's body
      schema:
        type: string
        maxLength: 200
    SearchStateType:
      name: state_type
      in: query
      description: State type names, matched lower-cased (e.g. new, open, closed, merged, removed, "pending reminder", "pending auto"); `pending` means both pending types. Comma-separated or repeated.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          maxLength: 200
    SearchStateId:
      name: state_id
      in: query
      description: State IDs (positive integers), comma-separated or repeated
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
          format: int64
          minimum: 1
    SearchQueueId:
      name: queue_id
      in: query
      description: Queue IDs (positive integers), comma-separated or repeated; still limited to readable queues
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
          format: int64
          minimum: 1
    SearchPriorityId:
      name: priority_id
      in: query
      description: Priority IDs (positive integers), comma-separated or repeated
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
          format: int64
          minimum: 1
    SearchTypeId:
      name: type_id
      in: query
      description: Ticket type IDs (positive integers), comma-separated or repeated
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
          format: int64
          minimum: 1
    SearchOwnerId:
      name: owner_id
      in: query
      description: Owner agent IDs (positive integers), comma-separated or repeated
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
          format: int64
          minimum: 1
    SearchResponsibleId:
      name: responsible_id
      in: query
      description: Responsible agent IDs (positive integers), comma-separated or repeated
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
          format: int64
          minimum: 1
    SearchLockId:
      name: lock_id
      in: query
      description: Lock IDs (positive integers), comma-separated or repeated
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
          format: int64
          minimum: 1
    SearchCreatedAfter:
      name: created_after
      in: query
      description: Created at or after (YYYY-MM-DD, "YYYY-MM-DD HH:MM:SS" or RFC 3339)
      schema:
        type: string
    SearchCreatedBefore:
      name: created_before
      in: query
      description: Created at or before; a bare date includes the whole day
      schema:
        type: string
    SearchChangedAfter:
      name: changed_after
      in: query
      description: Changed at or after (YYYY-MM-DD, "YYYY-MM-DD HH:MM:SS" or RFC 3339)
      schema:
        type: string
    SearchChangedBefore:
      name: changed_before
      in: query
      description: Changed at or before; a bare date includes the whole day
      schema:
        type: string
    SearchSort:
      name: sort
      in: query
      description: Sort column (ties broken by ticket ID in the same direction)
      schema:
        type: string
        enum:
          - created
          - changed
          - priority
          - tn
          - title
        default: created
    SearchOrder:
      name: order
      in: query
      description: Sort direction (case-insensitive)
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
    SearchPage:
      name: page
      in: query
      description: Page number
      schema:
        type: integer
        minimum: 1
        default: 1
    SearchLimit:
      name: limit
      in: query
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
