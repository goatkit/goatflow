  /api/v1/search/tickets:
    get:
      operationId: searchTickets
      summary: Search tickets
      description: |
        Agent ticket search over ticket, article and customer data. Agents only
        (customers get 403); API tokens need the `tickets:read` scope (or higher);
        the caller must have `ro` access to at least one queue, and results are
        limited to the queues the agent may read.

        Text parameters match case-insensitively anywhere in the column; `*` is a
        wildcard (then the pattern is anchored), `%`, `_` and `\` match literally.
        Text and date parameters accept one value only. ID and `state_type`
        parameters accept comma-separated and/or repeated values (any-of). Empty
        values are ignored. Any query parameter not listed here is rejected with 400.
        Date parameters take `YYYY-MM-DD`, `YYYY-MM-DD HH:MM:SS` (UTC) or RFC 3339;
        a bare date for `*_before` includes that whole day.
      tags:
        - Search
      parameters:
        - $ref: '#/components/parameters/SearchQ'
        - $ref: '#/components/parameters/SearchTn'
        - $ref: '#/components/parameters/SearchTitle'
        - $ref: '#/components/parameters/SearchCustomerId'
        - $ref: '#/components/parameters/SearchCustomerUserLogin'
        - $ref: '#/components/parameters/SearchFrom'
        - $ref: '#/components/parameters/SearchTo'
        - $ref: '#/components/parameters/SearchSubject'
        - $ref: '#/components/parameters/SearchBody'
        - $ref: '#/components/parameters/SearchStateType'
        - $ref: '#/components/parameters/SearchStateId'
        - $ref: '#/components/parameters/SearchQueueId'
        - $ref: '#/components/parameters/SearchPriorityId'
        - $ref: '#/components/parameters/SearchTypeId'
        - $ref: '#/components/parameters/SearchOwnerId'
        - $ref: '#/components/parameters/SearchResponsibleId'
        - $ref: '#/components/parameters/SearchLockId'
        - $ref: '#/components/parameters/SearchCreatedAfter'
        - $ref: '#/components/parameters/SearchCreatedBefore'
        - $ref: '#/components/parameters/SearchChangedAfter'
        - $ref: '#/components/parameters/SearchChangedBefore'
        - $ref: '#/components/parameters/SearchSort'
        - $ref: '#/components/parameters/SearchOrder'
        - $ref: '#/components/parameters/SearchPage'
        - $ref: '#/components/parameters/SearchLimit'
      responses:
        '200':
          description: One page of matching tickets
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/SearchResultPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/search/saved:
    get:
      operationId: listSavedSearches
      summary: List saved searches
      description: |
        Lists the calling agent's saved ticket searches (names only), sorted by
        name. Saved searches live in the OTRS `search_profile` table under login
        `TicketSearch::<agent login>`, so they are private to the agent and
        shared with OTRS/Znuny ticket search profiles of the same agent.
        Agents only; API tokens need `tickets:read`; caller needs `ro` access to
        at least one queue.
      tags:
        - Search
      responses:
        '200':
          description: The caller's saved searches
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - searches
                      - total
                    properties:
                      searches:
                        type: array
                        items:
                          $ref: '#/components/schemas/SearchSavedSummary'
                      total:
                        type: integer
                        description: Number of entries in `searches`
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createSavedSearch
      summary: Create saved search
      description: |
        Saves a ticket search for the calling agent under a new name. Stored as
        one `search_profile` row per value (login `TicketSearch::<agent login>`,
        `profile_type` SCALAR for text/date parameters, ARRAY for ID/list
        parameters, `profile_key` the OTRS attribute name, e.g. `QueueIDs`).
        Parameters are validated exactly like the query parameters of
        `GET /api/v1/search/tickets`; paging parameters (`page`, `limit`, `sort`,
        `order`) are not search parameters and are rejected.
        Agents only; API tokens need `tickets:read`; caller needs `ro` access to
        at least one queue.
      tags:
        - Search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchSavedCreateRequest'
      responses:
        '201':
          description: Saved search created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSavedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/search/saved/{name}:
    get:
      operationId: getSavedSearch
      summary: Get saved search
      description: |
        Returns one of the calling agent's saved searches (looked up by
        `search_profile.login = TicketSearch::<agent login>` and
        `profile_name`). Stored attributes this API does not search on (e.g.
        OTRS result-form settings) or whose values do not validate are listed
        in `ignored_parameters` instead of `parameters`.
        Agents only; API tokens need `tickets:read`; caller needs `ro` access to
        at least one queue.
      tags:
        - Search
      parameters:
        - $ref: '#/components/parameters/SearchName'
      responses:
        '200':
          description: The saved search
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/SearchSavedDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateSavedSearch
      summary: Update saved search
      description: |
        Replaces all stored parameters of one of the calling agent's saved
        searches (all its `search_profile` rows are deleted and rewritten,
        including attributes previously reported as ignored). The search cannot
        be renamed: `name` and `type` in the body are ignored. The body is
        parsed before the search is looked up, so malformed JSON gives 400 even
        for an unknown name.
        Agents only; API tokens need `tickets:read`; caller needs `ro` access to
        at least one queue.
      tags:
        - Search
      parameters:
        - $ref: '#/components/parameters/SearchName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchSavedUpdateRequest'
      responses:
        '200':
          description: Saved search updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSavedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteSavedSearch
      summary: Delete saved search
      description: |
        Deletes all `search_profile` rows of one of the calling agent's saved
        searches. Agents only; API tokens need `tickets:read`; caller needs `ro`
        access to at least one queue.
      tags:
        - Search
      parameters:
        - $ref: '#/components/parameters/SearchName'
      responses:
        '204':
          description: Saved search deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/search/saved/{name}/execute:
    post:
      operationId: executeSavedSearch
      summary: Execute saved search
      description: |
        Runs one of the calling agent's saved searches, limited to the queues
        the agent may read. Paging and ordering come from the query string;
        other query parameters are ignored and no request body is read. Paging
        parameters are validated before the search is looked up. If every
        stored attribute is ignored, the search has no criteria and returns all
        tickets in the agent's readable queues.
        Agents only; API tokens need `tickets:read`; caller needs `ro` access to
        at least one queue.
      tags:
        - Search
      parameters:
        - $ref: '#/components/parameters/SearchName'
        - $ref: '#/components/parameters/SearchSort'
        - $ref: '#/components/parameters/SearchOrder'
        - $ref: '#/components/parameters/SearchPage'
        - $ref: '#/components/parameters/SearchLimit'
      responses:
        '200':
          description: One page of matching tickets plus the saved search used
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    allOf:
                      - $ref: '#/components/schemas/SearchResultPage'
                      - type: object
                        required:
                          - name
                          - parameters
                          - ignored_parameters
                        properties:
                          name:
                            type: string
                          parameters:
                            $ref: '#/components/schemas/SearchParameters'
                          ignored_parameters:
                            $ref: '#/components/schemas/SearchIgnoredParameters'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: JWT from login, or a `gf_...` API token
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: Session cookie set by the web login
  responses:
    BadRequest:
      description: The request is malformed or fails validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No credentials, or the token is invalid, expired or revoked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: core:unauthorized
              message: Authentication required
    Forbidden:
      description: The caller is authenticated but not allowed to do this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource does not exist (or the caller may not see it)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The request conflicts with existing data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server or database error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A required backend (database, token verifier) is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      description: |
        Error body. Authentication and scope middleware send `error` as an
        object with a namespaced `code`; handlers send `error` as a message
        string, usually with `success: false`.
      required:
        - error
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/ApiErrorDetail'
    ApiErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: core:unauthorized
        message:
          type: string
    TicketListItem:
      type: object
      required:
        - id
        - tn
        - ticket_number
        - title
        - queue_id
        - queue_name
        - state_id
        - state_name
        - priority_id
        - priority_name
        - customer_user_id
        - customer_id
        - user_id
        - responsible_user_id
        - created_at
        - updated_at
        - create_time
        - update_time
      properties:
        id:
          type: integer
          format: int64
        tn:
          type: string
          description: Ticket number
        ticket_number:
          type: string
          description: Same as `tn`
        title:
          type: string
        queue_id:
          type: integer
        queue_name:
          type: string
        state_id:
          type: integer
        state_name:
          type: string
        priority_id:
          type: integer
        priority_name:
          type: string
        customer_user_id:
          type: string
          description: Customer login; empty string when unset
        customer_id:
          type: string
          description: Customer company ID; empty string when unset
        user_id:
          type: integer
          description: Owner user ID
        responsible_user_id:
          type: integer
          nullable: true
        created_at:
          type: string
          description: Creation time as returned by the database driver
        updated_at:
          type: string
          description: Last change time as returned by the database driver
        create_time:
          type: string
          description: Same as `created_at`
        update_time:
          type: string
          description: Same as `updated_at`
        article_count:
          type: integer
          description: Only with `include=article_count`
        last_article:
          type: object
          nullable: true
          description: Only with `include=last_article`; null when the ticket has no article
          required:
            - subject
            - created_at
          properties:
            subject:
              type: string
            created_at:
              type: string
    TicketListResponse:
      type: object
      required:
        - success
        - data
        - pagination
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: '#/components/schemas/TicketListItem'
        pagination:
          type: object
          required:
            - page
            - per_page
            - total
            - total_pages
            - has_next
            - has_prev
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            total_pages:
              type: integer
            has_next:
              type: boolean
            has_prev:
              type: boolean
    TicketCreateRequest:
      type: object
      required:
        - title
        - queue_id
      properties:
        title:
          type: string
          minLength: 1
        queue_id:
          type: integer
          minimum: 1
          description: Target queue; caller needs `create` permission on it
        priority_id:
          type: integer
          description: Omitted or 0 = service default
        state_id:
          type: integer
          description: Omitted or 0 = service default
        type_id:
          type: integer
          description: Omitted or 0 = none/default
        body:
          type: string
