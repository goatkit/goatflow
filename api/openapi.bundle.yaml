            - title
            - state_id
            - state
            - priority_id
            - priority
            - queue_id
            - queue
            - owner_user_id
            - create_time
            - change_time
            - article_count
          properties:
            id:
              type: integer
              format: int64
            ticket_number:
              type: string
            title:
              type: string
            state_id:
              type: integer
            state:
              type: string
              description: State name (empty if the state row is missing)
            priority_id:
              type: integer
            priority:
              type: string
              description: Priority name
            queue_id:
              type: integer
            queue:
              type: string
              description: Queue name
            owner_user_id:
              type: integer
            type_id:
              type: integer
              description: Omitted when unset
            customer_id:
              type: string
              description: Omitted when NULL
            customer_user_id:
              type: string
              description: Omitted when NULL
            responsible_user_id:
              type: integer
              description: Omitted when NULL
            create_time:
              type: string
              format: date-time
            change_time:
              type: string
              format: date-time
            article_count:
              type: integer
    TicketUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: At least one field. Integer fields must be positive whole numbers.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Must not be blank
        queue_id:
          type: integer
          minimum: 1
          description: Valid queue; needs `move_into` on it
        type_id:
          type: integer
          minimum: 1
        state_id:
          type: integer
          minimum: 1
        priority_id:
          type: integer
          minimum: 1
          description: Needs `priority` permission
        user_id:
          type: integer
          minimum: 1
          description: New owner (valid user); needs `owner` permission
        responsible_user_id:
          type: integer
          minimum: 1
        ticket_lock_id:
