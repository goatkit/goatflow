openapi: 3.0.3
info:
  title: GoatFlow API
  description: |
    REST API v1 of GoatFlow, an OTRS/Znuny-compatible helpdesk.

    Authenticate with `Authorization: Bearer <token>`, where the token is either a
    JWT from `POST /api/v1/auth/login` or a personal API token (`gf_...`) created
    under Settings -> API Tokens (`/settings/tokens`). Browser sessions
    authenticate with the `auth_token` cookie set at login.

    API tokens carry scopes. A token without the scope an endpoint needs gets
    `403`. Agent tokens pass admin checks only when they carry `admin:*` (or
    `*`, or no scopes) and their owner is an admin.

    Every path here is checked against the router by
    `TestOpenAPISpecMatchesRoutes` (internal/api). The liveness probe
    `GET /health` and the MCP endpoint (`/api/mcp`, see docs/api/MCP.md) are
    not part of this API.
  version: 0.10.0
  contact:
    name: GoatFlow Team
    url: https://github.com/goatkit/goatflow
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /
    description: The GoatFlow server that serves this document
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Tickets
    description: Tickets (OTRS `ticket` table)
  - name: Articles
    description: Messages and notes on a ticket
  - name: Queues
    description: Ticket queues
  - name: Priorities
    description: Ticket priorities
  - name: Users
    description: The calling user
  - name: Webhooks
    description: Outbound webhooks and their delivery log (admin only)
  - name: Search
    description: Ticket search and saved searches
paths:
  /api/v1/tickets:
    get:
      operationId: listTickets
      summary: List tickets
      description: |
        Paginated ticket list. Callable by agents and customers (JWT, session
        cookie or API token; no API-token scope is checked).

        - Agents need `ro` permission on at least one queue (admins bypass);
          results are limited to tickets in queues the agent can read.
        - Customers pass the queue check and only ever see tickets whose
          `customer_user_id` is their own login.

        Invalid or out-of-range numeric query values are ignored (defaults
        apply). `status` values other than `open`, `closed` and `pending`
        are accepted but have no effect.
      tags:
        - Tickets
      parameters:
        - name: page
          in: query
          description: Page number (values < 1 or non-numeric are ignored).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          description: Page size; values above 100 are capped at 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: limit
          in: query
          description: Alias for `per_page`; overrides it when both are given. Capped at 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Row offset; converted to `page = offset / per_page + 1` and overrides `page`.
          schema:
            type: integer
            minimum: 0
        - name: status
          in: query
          description: |
            State category filter. `open` = new/open state types, `closed` =
            closed state types, `pending` = pending state types. Any other
            value is ignored.
          schema:
            type: string
            enum:
              - open
              - closed
              - pending
        - name: queue_id
          in: query
          description: Only tickets in this queue.
          schema:
            type: integer
        - name: priority_id
          in: query
          description: Only tickets with this priority.
          schema:
            type: integer
        - name: customer_user_id
          in: query
          description: Only tickets of this customer login (`ticket.customer_user_id`).
          schema:
            type: string
        - name: assigned_user_id
          in: query
          description: Only tickets whose responsible user is this user ID.
          schema:
            type: integer
        - name: search
          in: query
          description: Case-insensitive substring match on the title, or exact ticket number.
          schema:
            type: string
        - name: sort
          in: query
          description: Sort field; unknown values sort by creation time.
          schema:
            type: string
            enum:
              - created
              - updated
              - priority
              - tn
              - title
            default: created
        - name: order
          in: query
          description: Sort direction; any other value means `desc`.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: include
          in: query
          description: |
            Comma-separated extras per ticket: `article_count` adds
            `article_count`, `last_article` adds `last_article`. Unknown
            entries are ignored.
          schema:
            type: string
          example: article_count,last_article
      responses:
        '200':
          description: One page of tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Agent without `ro` on any queue ("You do not have access to any
            queues"), or a customer whose login cannot be resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createTicket
      summary: Create a ticket
      description: |
        Agents only (customers get 403). The caller needs `create` permission
        on the target queue (admins bypass). No API-token scope is checked.

        The queue is read from `queue_id` in the JSON body (or the
        `queue_id` query/form parameter); all given values must agree.
        An initial customer-visible article with the ticket title as
        subject and `body` as content is created. When `customer_email` is
        given, a "Ticket Created" email is queued to it asynchronously.
        Form-encoded bodies (`application/x-www-form-urlencoded`,
        `multipart/form-data`) with the same field names are accepted as
        well; there `subject` and `description` are fallbacks for `title`
        and `body`.
      tags:
        - Tickets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCreateResponse'
        '400':
          description: |
            Missing/invalid/conflicting `queue_id` ("Queue ID is required",
            "Invalid queue ID", "Conflicting queue IDs in request"), body not
            parseable, missing `title` or `queue_id`, or the ticket service
            rejected the input (message passed through).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is a customer, or lacks `create` permission on the queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/tickets/{id}:
    get:
      operationId: getTicket
      summary: Get a ticket
      description: |
        Agents need `ro` permission on the ticket's queue (admins bypass);
        without it the response is 403 from the access check, or 404.
        Customers may read only tickets whose `customer_user_id` is their
        login and whose `customer_id` equals their own company; other
        tickets answer 404. No API-token scope is checked.

        The identifier must be the numeric ticket ID (a ticket number is
        rejected with 400).
      tags:
        - Tickets
      parameters:
        - $ref: '#/components/parameters/TicketIdPath'
      responses:
        '200':
          description: The ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketGetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Agent lacks `ro` on the ticket's queue, or the customer's
            `customer_user` record was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateTicket
      summary: Update a ticket
      description: |
        Agents only, with `rw` permission on the ticket's queue (admins
        bypass). No API-token scope is checked. Additionally:
        changing `priority_id` needs `priority` (or `rw`), changing
        `user_id` needs `owner` (or `rw`) on the current queue, and changing
        `queue_id` needs `move_into` on the new queue.

        Only the given fields change. Unknown fields are rejected. One
        history entry is written per changed field, in the same
        transaction as the update. Returns the updated ticket.
      tags:
        - Tickets
      parameters:
        - $ref: '#/components/parameters/TicketIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketUpdateRequest'
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketUpdateResponse'
        '400':
          description: |
            Non-numeric ticket ID, invalid JSON, empty object ("No fields to
            update"), unknown field, wrong type/length, empty title, or a
            referenced ID that does not exist or is not valid (e.g.
            "Invalid queue_id").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is a customer, or lacks the queue permission for the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteTicket
      summary: Archive a ticket
      description: |
        Agents only, with `rw` permission on the ticket's queue (admins
        bypass). No API-token scope is checked. Tickets are never hard
        deleted: the state is set to `closed successful`, `archive_flag` to
        1, and an internal "Ticket Archived" article is added.
      tags:
        - Tickets
      parameters:
        - $ref: '#/components/parameters/TicketIdPath'
      responses:
        '204':
          description: Ticket archived
        '400':
          description: Non-numeric ticket ID, or the ticket is already in a closed state type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/tickets/{id}/reopen:
    post:
      operationId: reopenTicket
      summary: Reopen a closed ticket
      description: |
        Agents only, with `rw` permission on the ticket's queue (admins
        bypass). No API-token scope is checked. Only tickets whose state
        type is `closed` can be reopened; the state becomes `open`,
        `archive_flag` is cleared and a customer-visible "Ticket Reopened"
        article containing the reason is added.
      tags:
        - Tickets
      parameters:
        - $ref: '#/components/parameters/TicketIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketReopenRequest'
      responses:
        '200':
          description: Ticket reopened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketReopenResponse'
        '400':
          description: Non-numeric ticket ID, missing `reason`, or the ticket is not closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/tickets/{id}/articles:
    get:
      operationId: listTicketArticles
      summary: List ticket articles
      description: |
        Returns all articles of a ticket, newest first (`create_time DESC, id DESC`), without pagination.

        Callable by agents with `ro` permission on the ticket's queue (admins bypass the queue check)
        and by customers who own the ticket (`customer_user_id` equals their login). Customers only
        see articles with `is_visible_for_customer = true`. Tickets the caller cannot see, including
        other customers' tickets, return 404. Agents without `ro` on the queue get 403.
      tags:
        - Articles
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ticket ID.
          schema:
            type: integer
            minimum: 1
        - name: include_attachments
          in: query
          required: false
          description: When exactly `true`, each article gets an `attachments` array (HTML body parts are excluded). Any other value is ignored.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
      responses:
        '200':
          description: Articles of the ticket.
          content:
            application/json:
              schema:
                type: object
                required:
                  - articles
                  - total
                properties:
                  articles:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArticleDetail'
                  total:
                    type: integer
                    description: Number of returned articles.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createTicketArticle
      summary: Add an article to a ticket
      description: |
        Creates an article (reply or note) on a ticket and updates the ticket's `change_time`.

        Agents only (customers get 403 `Agent access required`); the agent needs `note` permission
        on the ticket's queue (403 from middleware otherwise; admins bypass). The handler re-checks
        `note`/`rw` and answers 404 if that fails.

        Behaviour:
        - `body` is required (non-blank); `content_type` defaults to `text/plain`.
        - `from`/`to` fall back to `from_email`/`to_email`.
        - Sender: `article_sender_type_id` (must exist, else 400), else `sender_type` name, else agent.
        - Visibility key precedence: `is_visible`, `is_visible_to_customer`, `is_visible_for_customer`.
        - `article_type` picks channel and visibility; without it, a visibility flag picks
          `note-external`/`note-internal`. Unknown type -> 400 `Invalid article type`; type not
          allowed for the sender -> 400.
        - `communication_channel_id` overrides the derived channel and must exist.
        - `time_unit` > 0 adds a time accounting row (failure is ignored).
        - Customer-visible articles on tickets with a customer queue a notification email.
      tags:
        - Articles
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ticket ID.
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCreateRequest'
      responses:
        '201':
          description: Article created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/ArticleCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/tickets/{id}/articles/{article_id}:
    get:
      operationId: getTicketArticle
      summary: Get a ticket article
      description: |
        Returns one article of a ticket. Same access rules as listing: agents with `ro` on the
        ticket's queue (admins bypass), or the customer owning the ticket. Articles not on this
        ticket, and internal articles requested by a customer, return 404 `Article not found`.
      tags:
        - Articles
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ticket ID.
          schema:
            type: integer
            minimum: 1
        - name: article_id
          in: path
          required: true
          description: Numeric article ID; must belong to the ticket.
          schema:
            type: integer
        - name: include_attachments
          in: query
          required: false
          description: When exactly `true`, the article gets an `attachments` array (HTML body parts are excluded).
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
      responses:
        '200':
          description: The article.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/queues:
    get:
      operationId: listQueues
      summary: List queues
      description: |
        Agents only (customers get 403). Requires read (`ro`) permission on at
        least one queue (`queue_ro` middleware); admins bypass that check.
        Returns the queues on which the caller holds any queue permission,
        ordered by name. Optional keys are omitted when the column is NULL.
        Ticket counters are added only with `include_stats=true` and only for
        queues the caller can read.
      tags:
        - Queues
      parameters:
        - name: valid
          in: query
          required: false
          description: '`1` = valid queues only, `2` = invalid only; any other value is ignored (all queues).'
          schema:
            type: string
        - name: include_stats
          in: query
          required: false
          description: '`true` adds ticket_count/open_tickets/closed_tickets/pending_tickets.'
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: filter_attribute
          in: query
          required: false
          description: Ticket attribute (e.g. `Type`) whose ticket-attribute-relations restrict the list. Used only together with `filter_value`.
          schema:
            type: string
        - name: filter_value
          in: query
          required: false
          description: Value of `filter_attribute`.
          schema:
            type: string
      responses:
        '200':
          description: Queues visible to the caller
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/QueueListItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createQueue
      summary: Create queue
      description: |
        Admins only (`admin` middleware). The handler additionally requires
        `user_role == "Admin"`, so admin-scoped API tokens (role `User`) pass
        the middleware but are refused with 403 "Admin role required".
        The queue is created valid (`valid_id` 1). Defaults:
        system_address_id/salutation_id/signature_id 1, follow_up_id 1,
        negative unlock_timeout becomes 0.
      tags:
        - Queues
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueCreateRequest'
      responses:
        '201':
          description: Queue created
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/QueueCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/queues/{id}:
    get:
      operationId: getQueue
      summary: Get queue
      description: |
        Agents only. Requires `ro` permission on this queue (`queue_access_ro`
        middleware; admins bypass; otherwise 403). Any lookup failure,
        including a missing queue, answers 404. Optional keys are omitted
        when NULL.
      tags:
        - Queues
      parameters:
        - name: id
          in: path
          required: true
          description: Queue ID
          schema:
            type: integer
            minimum: 0
            maximum: 4294967295
      responses:
        '200':
          description: The queue
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/QueueDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateQueue
      summary: Update queue
      description: |
        Admins only (`admin` middleware). Partial update: only keys present in
        the body change. `name` must be non-blank and unique
        (case-insensitive, 409 otherwise); `group_id` must reference an
        existing valid group; `system_address_id`, `salutation_id`,
        `signature_id` and `comments` may be set to null. A body without any
        known key changes nothing and returns the current values. Errors from
        this handler carry only `error` (no `success`) except group errors.
      tags:
        - Queues
      parameters:
        - name: id
          in: path
          required: true
          description: Queue ID
          schema:
            type: integer
            minimum: 0
            maximum: 4294967295
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueUpdateRequest'
      responses:
        '200':
          description: Queue after the update
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/QueueUpdated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteQueue
      summary: Invalidate queue
      description: |
        Admins only (`admin` middleware). Soft delete: sets `valid_id` to 2.
        Queues 1-3 are system queues (403). A queue that still has tickets
        cannot be deleted (409).
      tags:
        - Queues
      parameters:
        - name: id
          in: path
          required: true
          description: Queue ID
          schema:
            type: integer
            minimum: 0
            maximum: 4294967295
      responses:
        '200':
          description: Queue invalidated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/queues/{id}/stats:
    get:
      operationId: getQueueStats
      summary: Get queue ticket statistics
      description: |
        Agents only. Requires `ro` permission on this queue (`queue_access_ro`
        middleware, admins bypass). The handler re-checks read permission via
        the permission service and answers 404 (not 403) when it fails or the
        queue does not exist.
      tags:
        - Queues
      parameters:
        - name: id
          in: path
          required: true
          description: Queue ID
          schema:
            type: integer
            minimum: 0
            maximum: 4294967295
      responses:
        '200':
          description: Ticket counters of the queue
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/QueueStats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/priorities:
    get:
      operationId: listPriorities
      summary: List priorities
      description: |
        Any agent (customers get 403). Ordered by id. On 500 the response also
        carries an `X-Guru-Error` header.
      tags:
        - Priorities
      parameters:
        - name: valid
          in: query
          required: false
          description: |
            `true`/`1`/empty = valid only (default), `false`/`0` = invalid
            only, `all` = no filter. Case-insensitive; unknown values act as
            `true`.
          schema:
            type: string
            default: 'true'
        - name: filter_attribute
          in: query
          required: false
          description: Ticket attribute whose ticket-attribute-relations restrict the list. Used only together with `filter_value`.
          schema:
            type: string
        - name: filter_value
          in: query
          required: false
          description: Value of `filter_attribute`.
          schema:
            type: string
      responses:
        '200':
          description: Priorities
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Priority'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createPriority
      summary: Create priority
      description: |
        Admins only (`admin` middleware). Created valid; `color` defaults to
        `#cdcdcd`. A valid priority with the same name gives 409. Any bind
        error answers 400 "Name is required".
      tags:
        - Priorities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriorityCreateRequest'
      responses:
        '201':
          description: Priority created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriorityEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/priorities/{id}:
    get:
      operationId: getPriority
      summary: Get priority
      description: |
        Any agent. Returns the priority object itself (no `success`/`data`
        envelope), valid or not. Any lookup failure answers 404.
      tags:
        - Priorities
      parameters:
        - name: id
          in: path
          required: true
          description: Priority ID
          schema:
            type: integer
      responses:
        '200':
          description: The priority (not enveloped)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Priority'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updatePriority
      summary: Update priority
      description: |
        Admins only (`admin` middleware). `name` is always written, so an
        omitted name sets it to the empty string. Empty or omitted `color`
        keeps the current color. The response always reports `valid_id` 1.
        IDs outside the smallint range answer 404.
      tags:
        - Priorities
      parameters:
        - name: id
          in: path
          required: true
          description: Priority ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriorityUpdateRequest'
      responses:
        '200':
          description: Priority after the update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriorityEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deletePriority
      summary: Invalidate priority
      description: |
        Admins only (`admin` middleware). Soft delete: sets `valid_id` to 2.
        Priority 1 is a system priority (403). IDs outside the smallint range
        or unknown IDs answer 404.
      tags:
        - Priorities
      parameters:
        - name: id
          in: path
          required: true
          description: Priority ID
          schema:
            type: integer
      responses:
        '200':
          description: Priority invalidated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriorityMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      summary: Get current user
      description: |
        Any agent (customers get 403). Returns the calling agent's `users`
        row. `email` is the login (the users table has no email column).
