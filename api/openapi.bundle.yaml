        customer_email:
          type: string
          description: When set, a "Ticket Created" email is queued to this address
        customer_id:
          type: string
          description: Customer company ID
        customer_user_id:
          type: string
          description: Customer login
    TicketCreateResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          required:
            - id
            - tn
            - title
            - queue_id
            - ticket_state_id
            - ticket_priority_id
          properties:
            id:
              type: integer
              format: int64
            tn:
              type: string
            title:
              type: string
            queue_id:
              type: integer
            ticket_state_id:
              type: integer
            ticket_priority_id:
              type: integer
    TicketGetResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          required:
