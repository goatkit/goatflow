      operationId: redeliverWebhookDelivery
      summary: Redeliver webhook delivery
      description: |
        Admins only. Sends the payload of an earlier delivery again now as a
        new delivery (one attempt, no retries, also when the webhook is
        inactive) and returns the new delivery. A failed HTTP attempt is still
        200 with `success: false` in the delivery. No request body.
